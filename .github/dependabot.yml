version: 2
updates:
  # Keep GitHub Actions current without opening one PR per minor/patch update.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep npm updates reviewable. Generic majors stay separate so they can be
  # tested deliberately; the coordinated post-RC migrations listed in
  # ROADMAP.md are ignored until that release gate is complete.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "bootstrap"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@typescript-eslint/eslint-plugin"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@typescript-eslint/parser"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@fortawesome/fontawesome-svg-core"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@fortawesome/free-regular-svg-icons"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@fortawesome/free-solid-svg-icons"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@fortawesome/react-fontawesome"
        update-types:
          - "version-update:semver-major"
