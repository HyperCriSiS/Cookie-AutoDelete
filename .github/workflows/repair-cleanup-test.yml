name: Repair cleanup test
on:
  push:
    branches: [modernization-p0]
    paths: ['.github/workflows/repair-cleanup-test.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernization-p0
      - name: Fix confirmed-removal mock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('__tests__/services/CleanupService.spec.ts')
          s = p.read_text()
          old = '''        when(global.browser.cookies.remove)\n          .calledWith(expect.any(Object))\n          .mockResolvedValue({} as never);'''
          new = '''        (global.browser.cookies.remove as jest.Mock).mockResolvedValue({});'''
          if old not in s:
              raise SystemExit('expected temporary mock block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add __tests__/services/CleanupService.spec.ts
          git commit -m "test: mock successful cookie removals directly"
          git push
