name: Repair cleanup test assertion

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/repair-cleanup-test.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernization-p0
      - name: Repair corrupted assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('__tests__/services/CleanupService.spec.ts')
          text = path.read_text()
          broken = 'expect(spyCleanupService.cleanSiteData).not.toHaveBeenCalled();edTimes(1);'
          fixed = 'expect(spyCleanupService.cleanSiteData).not.toHaveBeenCalled();'
          if broken not in text:
              raise SystemExit('expected corrupted assertion not found')
          path.write_text(text.replace(broken, fixed, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __tests__/services/CleanupService.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: repair cleanup assertion syntax"
          git push origin HEAD:modernization-p0
