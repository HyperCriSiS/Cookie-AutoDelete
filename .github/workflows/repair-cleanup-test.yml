name: Repair CleanupService test corruption

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/repair-cleanup-test.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernization-p0
          fetch-depth: 0

      - name: Repair malformed assertion
        shell: bash
        run: |
          set -euo pipefail
          file='__tests__/services/CleanupService.spec.ts'
          broken='expect(spyCleanupService.cleanSiteData).not.toHaveBeenCalled();edTimes(1);'
          fixed='expect(spyCleanupService.cleanSiteData).not.toHaveBeenCalled();'
          grep -F "$broken" "$file"
          python - <<'PY'
          from pathlib import Path
          path = Path('__tests__/services/CleanupService.spec.ts')
          text = path.read_text()
          broken = 'expect(spyCleanupService.cleanSiteData).not.toHaveBeenCalled();edTimes(1);'
          fixed = 'expect(spyCleanupService.cleanSiteData).not.toHaveBeenCalled();'
          if text.count(broken) != 1:
              raise SystemExit(f'expected exactly one malformed assertion, found {text.count(broken)}')
          path.write_text(text.replace(broken, fixed))
          PY

      - name: Verify syntax target
        run: npx jest __tests__/services/CleanupService.spec.ts --runInBand

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add __tests__/services/CleanupService.spec.ts
          git diff --cached --check
          git commit -m 'test: repair CleanupService pluginData assertion'
          git push origin HEAD:modernization-p0
