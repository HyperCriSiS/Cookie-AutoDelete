name: Validate cleanup regression
on:
  push:
    branches: [modernization-p0]
    paths: ['.github/workflows/repair-cleanup-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernization-p0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand __tests__/services/CleanupService.spec.ts
