name: automation-profile-upgrade
on:
  push:
    branches: [modernization-p0]
    paths: [.github/workflows/automation-profile-upgrade.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '=== ROADMAP ==='
          grep -nE '^[-*] \[ \]|^##|^###|Status|Blocker' ROADMAP.md || true
          echo '=== StateHydration ==='
          cat src/services/StateHydration.ts
          echo '=== tests ==='
          cat __tests__/services/StateHydration.spec.ts
          echo '=== setting service ==='
          sed -n '1,280p' src/services/SettingService.ts
