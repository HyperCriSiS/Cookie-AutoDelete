name: Temporary release base synchronization

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/tmp-sync-release-base.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: modernization-p0
          fetch-depth: 0
      - name: Synchronize 3.X.X-Branch ancestry without replacing modernization tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin 3.X.X-Branch
          BASE_SHA=$(git rev-parse origin/3.X.X-Branch)
          test "$BASE_SHA" = "3e061b7f77175e536ff664788f3e6692ac6540e8"
          if git merge-base --is-ancestor "$BASE_SHA" HEAD; then
            echo "Base already synchronized."
            exit 0
          fi
          git merge --no-ff -s ours "$BASE_SHA" -m 'chore: synchronize hardened release base'
          git push origin HEAD:modernization-p0
