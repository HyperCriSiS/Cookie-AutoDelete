name: automation add Firefox legacy upgrade regression
on:
  push:
    branches: [modernization-p0]
    paths: ['.github/workflows/automation-add-firefox-legacy-upgrade-test.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add Firefox legacy-profile regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('__tests__/services/SettingService.spec.ts')
          s = p.read_text()
          anchor = "    it('should init if not yet initialized', async () => {"
          if "should tolerate a Firefox legacy profile while a site-data cleanup setting is still missing" not in s:
              block = '''    it('should tolerate a Firefox legacy profile while a site-data cleanup setting is still missing', async () => {\n      const { [SettingID.CLEANUP_CACHE]: _missingCleanupCache, ...legacySettings } =\n        initialState.settings;\n      const legacyStore: Store<State, ReduxAction> = createStore({\n        ...initialState,\n        settings: legacySettings,\n      });\n      legacyStore.dispatch({\n        type: ReduxConstants.ADD_CACHE,\n        payload: { key: 'browserDetect', value: browserName.Firefox },\n      });\n      legacyStore.dispatch({\n        type: ReduxConstants.ADD_CACHE,\n        payload: { key: 'browserVersion', value: 140 },\n      });\n      StoreUser.init(legacyStore);\n      SettingService.init();\n\n      legacyStore.dispatch(updateSetting({ name: SettingID.ACTIVE_MODE, value: true }));\n\n      await expect(SettingService.onSettingsChange()).resolves.toBeUndefined();\n      expect(global.browser.browsingData.remove).not.toHaveBeenCalled();\n\n      StoreUser.init(store);\n      SettingService.init();\n    });\n\n'''
              if anchor not in s:
                  raise SystemExit('anchor not found')
              s = s.replace(anchor, block + anchor, 1)
              p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run SettingService regression tests
        run: npx jest __tests__/services/SettingService.spec.ts --runInBand
      - name: Commit regression test
        run: |
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add __tests__/services/SettingService.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'test: cover Firefox legacy settings upgrade'
            git push origin HEAD:modernization-p0
          fi
