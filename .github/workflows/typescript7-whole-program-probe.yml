name: TypeScript 7 whole-program probe

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/typescript7-whole-program-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare isolated TypeScript 7 dependency set
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.devDependencies.typescript = '7.0.2';
          delete pkg.devDependencies['ts-jest'];
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Compile repository as a TypeScript 7 whole program
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const probe = {
            extends: './tsconfig.json',
            compilerOptions: {
              module: 'Node16',
              moduleResolution: 'Node16',
              noEmit: false,
              outDir: '.ts7-build',
              declaration: false,
              sourceMap: false
            }
          };
          fs.writeFileSync('tsconfig.ts7-probe.json', JSON.stringify(probe, null, 2) + '\n');
          NODE
          npx tsc -p tsconfig.ts7-probe.json --pretty false
