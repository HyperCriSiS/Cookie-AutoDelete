name: Temporary Phase 4 base synchronization

on:
  push:
    branches:
      - modernization-phase4-base-sync

permissions:
  contents: write

jobs:
  stage-package-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Stage current base package graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin 3.X.X-Branch
          git checkout origin/3.X.X-Branch -- package.json package-lock.json
          if git diff --cached --quiet -- package.json package-lock.json; then
            echo "Package graph already matches current base."
            exit 0
          fi
          git commit -m "chore: stage base package graph for sync" -- package.json package-lock.json
          git push origin HEAD:modernization-phase4-base-sync
