name: Temporary Phase 4 base synchronization

on:
  push:
    branches:
      - modernization-phase4-base-sync

permissions:
  contents: write

jobs:
  restore-package-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore validated modernization package graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout e8efcd6296def14a34cbbb1316c6e34c3546a075 -- package.json package-lock.json
          if git diff --cached --quiet -- package.json package-lock.json; then
            echo "Modernization package graph already restored."
            exit 0
          fi
          git commit -m "chore: restore modernization package graph after base sync" -- package.json package-lock.json
          git push origin HEAD:modernization-phase4-base-sync
