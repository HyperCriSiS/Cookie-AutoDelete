name: Temporary roadmap inspection

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/ts7-typing-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show TS7 roadmap section
        shell: bash
        run: |
          grep -n -A35 -B8 'web-ext-types\|TypeScript 7\|firefox-webext-browser' ROADMAP.md | head -160 || true
