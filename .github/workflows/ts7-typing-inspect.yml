name: Temporary TS7 typing inspection

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/ts7-typing-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe maintained WebExtension typings
        shell: bash
        run: |
          npm uninstall --save-dev web-ext-types
          npm install --save-dev @types/firefox-webext-browser
          sed -i '/node_modules\/web-ext-types/d' tsconfig.json
          rm src/typings/Webext.d.ts
          echo '=== installed firefox types ==='
          npm ls @types/firefox-webext-browser
          echo '=== TypeScript errors without compatibility layer ==='
          npx tsc --noEmit 2>&1 | tee /tmp/ts-errors.txt || true
          echo '=== error count ==='
          grep -c 'error TS' /tmp/ts-errors.txt || true
          echo '=== legacy compatibility symbol usage ==='
          grep -R 'EvListener\|CookiePartitionKey\|TabChangeInfo\|CookieProperties\|firstPartyDomain\|\.selected' -n src --include='*.ts' --include='*.tsx' | head -300 || true
