name: Temporary TS7 typing inspection

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/ts7-typing-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspect relevant maintained type shapes
        shell: bash
        run: |
          npm uninstall --save-dev web-ext-types
          npm install --save-dev @types/firefox-webext-browser
          echo '=== Cleanup.d.ts ==='
          cat src/typings/Cleanup.d.ts
          echo '=== Cookie and detail declarations ==='
          grep -n -A80 -B10 'interface Cookie' node_modules/@types/firefox-webext-browser/index.d.ts | head -260 || true
          echo '=== tabs updated declarations ==='
          grep -n -A60 -B10 'OnUpdated' node_modules/@types/firefox-webext-browser/index.d.ts | head -180 || true
          echo '=== contextual identities declarations ==='
          grep -n -A120 -B10 'namespace contextualIdentities' node_modules/@types/firefox-webext-browser/index.d.ts | head -180 || true
          echo '=== Event helper declarations ==='
          grep -n -A40 -B10 'type Event' node_modules/@types/firefox-webext-browser/index.d.ts | head -120 || true
          grep -R 'EvListener' -n src/typings src/services | head -100 || true
