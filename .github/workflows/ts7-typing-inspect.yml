name: Temporary roadmap update

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/ts7-typing-inspect.yml

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernization-p0
          fetch-depth: 0
      - name: Record validated WebExtension typing findings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          text = p.read_text()
          anchor = '- [ ] Replace/adapt `web-ext-types@3.2.1` using `@types/firefox-webext-browser` as the maintained base plus the smallest explicit local compatibility augmentation needed by Cookie AutoDelete; preserve Firefox-specific APIs and cross-browser behavior rather than reintroducing the old broad declaration file.'
          addition = (
              anchor + '\n'
              '    - [x] Validate the minimal compatibility-layer shape against the maintained Firefox typings: `CookiePartitionKey` can alias `PartitionKey`, `TabChangeInfo` can extend `_OnUpdatedChangeInfo`, legacy `Tab.selected` and contextual-identity change-info need only small local augmentations, and the generic event helper can be expressed structurally without retaining `web-ext-types`.\n'
              '    - [ ] Retype CAD-internal cookie paths and representative fixtures to the project cross-browser cookie shape so Chromium cookies may omit `firstPartyDomain`; then rerun webpack/tests before committing the dependency swap.'
          )
          if 'Validate the minimal compatibility-layer shape' not in text:
              if anchor not in text:
                  raise SystemExit('Exact roadmap anchor not found')
              text = text.replace(anchor, addition, 1)
              p.write_text(text)
          PY
          git config user.name "HyperCriSiS"
          git config user.email "dev.github@w3b.world"
          git add ROADMAP.md
          if git diff --cached --quiet; then
            echo 'No roadmap change needed.'
            exit 0
          fi
          git commit -m "docs: record WebExtension typing compatibility gate"
          git push origin HEAD:modernization-p0
