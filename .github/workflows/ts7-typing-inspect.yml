name: Temporary TS7 typing inspection

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/ts7-typing-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect browser type call sites
        shell: bash
        run: |
          echo '=== browser.cookies.Cookie references ==='
          grep -R 'browser\.cookies\.Cookie' -n src __tests__ --include='*.ts' --include='*.tsx' | head -300 || true
          echo '=== Libs event helper ==='
          sed -n '90,135p' src/services/Libs.ts
          echo '=== contextual identity event service ==='
          sed -n '1,90p' src/services/ContextualIdentitiesEvents.ts
          echo '=== contextual identity tests ==='
          sed -n '65,105p' __tests__/services/ContextualIdentitiesEvents.spec.ts
          echo '=== tabs type references ==='
          grep -R 'browser\.tabs\.TabChangeInfo\|selected:' -n src __tests__ --include='*.ts' --include='*.tsx' | head -250 || true
