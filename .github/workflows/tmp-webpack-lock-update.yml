name: Temporary Webpack lock update

on:
  push:
    branches:
      - modernization-p0

jobs:
  update-lockfile:
    if: >-
      github.event.head_commit.message == 'chore: fix Webpack lockfile generation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update Webpack lockfile with npm 8
        run: npx --yes npm@8.19.4 install --save-dev 'webpack@^5.109.2' --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated package metadata
        uses: actions/upload-artifact@v4
        with:
          name: webpack-5.109.2-package-metadata
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
