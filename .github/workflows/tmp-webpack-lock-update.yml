name: Temporary Webpack lock update

on:
  push:
    branches:
      - modernization-p0

permissions:
  contents: write

jobs:
  update-lockfile:
    if: >-
      github.event.head_commit.message == 'chore: apply Webpack lockfile generation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update Webpack lockfile with npm 8
        run: npx --yes npm@8.19.4 install --save-dev 'webpack@^5.109.2' --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package metadata changes generated."
            exit 0
          fi
          git commit -m "chore: update Webpack to 5.109.2"
          git push
