name: TypeScript 7 migration context

on:
  push:
    branches:
      - modernization-p0

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture migration context
        run: |
          echo '=== AMBIENT ENUMS ==='
          grep -R -n -E '(^|[[:space:]])(const[[:space:]]+)?enum[[:space:]]+(SettingID|SiteDataType|ListType|browserName)' src __tests__ || true
          echo '=== TSCONFIG MODULE SETTINGS ==='
          grep -n -E '"(target|module|moduleResolution)"' tsconfig.json || true
          echo '=== ROADMAP START ==='
          cat ROADMAP.md
          echo '=== ROADMAP END ==='
