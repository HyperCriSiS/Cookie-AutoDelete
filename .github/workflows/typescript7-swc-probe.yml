name: TypeScript 7 SWC probe

on:
  push:
    branches:
      - modernization-p0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Probe dependency migration
        run: |
          npm uninstall --save-dev ts-jest
          npm install --save-dev typescript@7.0.2 @swc/core@latest @swc/jest@latest
          sed -i "s/'ts-jest'/'@swc\\/jest'/g; s/\"ts-jest\"/\"@swc\\/jest\"/g" jest.config.js
          sed -i "/^[[:space:]]*preset: '@swc\/jest',[[:space:]]*$/d" jest.config.js
          echo '--- transformed config ---'
          grep -n "swc\|ts-jest\|preset\|transform" jest.config.js || true
          echo '--- package versions ---'
          npm ls typescript @swc/core @swc/jest jest ts-jest @typescript-eslint/parser @typescript-eslint/eslint-plugin ts-loader || true
      - name: Run tests
        run: npm test -- --runInBand
