name: TypeScript 7 browser typing probe

on:
  push:
    branches:
      - modernization-p0
    paths:
      - '.github/workflows/ts7-types-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Inspect browser and UI typing dependencies
        run: |
          node <<'NODE'
          const p = require('./package.json');
          const deps = {...p.dependencies, ...p.devDependencies};
          for (const [k,v] of Object.entries(deps).sort()) {
            if (/type|browser|chrome|firefox|webext|react|redux/i.test(k)) console.log(`${k}: ${v}`);
          }
          NODE
          npm ci
          echo '--- top-level relevant packages ---'
          npm ls --depth=0 2>/dev/null | grep -Ei 'type|browser|chrome|firefox|webext|react|redux' || true
          echo '--- browser namespace declaration sources ---'
          grep -RIl --include='*.d.ts' 'declare namespace browser\|namespace browser' node_modules src/typings 2>/dev/null | head -80
          echo '--- relevant TS config ---'
          cat tsconfig.json
