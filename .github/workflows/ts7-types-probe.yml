name: Roadmap inspection

on:
  push:
    branches:
      - modernization-p0
    paths:
      - '.github/workflows/ts7-types-probe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print roadmap
        run: cat ROADMAP.md
