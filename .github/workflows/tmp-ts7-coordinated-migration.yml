name: Temporary coordinated TypeScript 7 migration

on:
  push:
    branches: [modernization-p0]
    paths:
      - '.github/workflows/tmp-ts7-coordinated-migration.yml'
      - 'src/redux/Actions.ts'
      - 'src/ui/common_components/IconButton.tsx'
      - 'src/ui/common_components/ActivityTable.tsx'
      - 'src/typings/Enums.ts'
      - 'src/typings/Global.d.ts'
      - 'src/typings/Cleanup.d.ts'
      - 'src/services/Libs.ts'
      - 'src/services/CleanupService.ts'
      - 'src/background.ts'
      - '__tests__/services/Libs.spec.ts'
      - '__tests__/services/CleanupService.spec.ts'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Apply coordinated migration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete pkg.devDependencies['ts-jest'];
          pkg.devDependencies['@typescript/native'] = 'npm:typescript@7.0.2';
          pkg.devDependencies['typescript'] = 'npm:@typescript/typescript6@6.0.2';
          pkg.devDependencies = Object.fromEntries(Object.entries(pkg.devDependencies).sort(([a],[b]) => a.localeCompare(b)));
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          let tsconfig = fs.readFileSync('tsconfig.json', 'utf8');
          tsconfig = tsconfig.replace('"module": "commonjs"', '"module": "esnext"');
          tsconfig = tsconfig.replace('"moduleResolution": "node"', '"moduleResolution": "bundler"');
          tsconfig = tsconfig.replace('      "es2017",', '      "es2018",');
          tsconfig = tsconfig.replace('    // "types": [],                           /* Type declaration files to be included in compilation. */', '    "types": ["jest", "node"],                 /* Type declaration files required by tests and Node-based tooling. */');
          fs.writeFileSync('tsconfig.json', tsconfig);

          let jest = fs.readFileSync('jest.config.js', 'utf8');
          jest = jest.replace(/  \/\/ A set of global variables[\s\S]*?  },\n\n  \/\/ An array of directory names/, '  // An array of directory names');
          jest = jest.replace(/  \/\/ A preset that is used as a base for Jest's configuration\n  preset: 'ts-jest',\n\n/, '');
          const transformPattern = "    '^.+\\\\.tsx?$': 'ts-jest',";
          const transformer = "    '^.+\\\\.tsx?$': '<rootDir>/tools/jest-typescript-transformer.cjs',";
          if (!jest.includes(transformPattern)) throw new Error('ts-jest transform pattern not found');
          jest = jest.replace(transformPattern, () => transformer);
          if (jest.includes('ts-jest')) throw new Error('ts-jest configuration remained in jest.config.js');
          fs.writeFileSync('jest.config.js', jest);

          let enums = fs.readFileSync('src/typings/Enums.ts', 'utf8');
          if (!enums.includes('export enum EventListenerAction')) {
            enums += "\nexport enum EventListenerAction {\n  ADD = 'ADD',\n  REMOVE = 'REMOVE',\n}\n";
          }
          if (!enums.includes('export enum ReasonKeep')) {
            enums += "\nexport enum ReasonKeep {\n  OpenTabs = 'reasonKeepOpenTab',\n  MatchedExpression = 'reasonKeep',\n}\n";
          }
          fs.writeFileSync('src/typings/Enums.ts', enums);

          let globals = fs.readFileSync('src/typings/Global.d.ts', 'utf8');
          globals = globals.replace(/\ndeclare const enum EventListenerAction \{\n  ADD = 'ADD',\n  REMOVE = 'REMOVE',\n\}\n/, '\n');
          fs.writeFileSync('src/typings/Global.d.ts', globals);

          let cleanupTypes = fs.readFileSync('src/typings/Cleanup.d.ts', 'utf8');
          cleanupTypes = cleanupTypes.replace(/\ndeclare const enum ReasonKeep \{\n  OpenTabs = 'reasonKeepOpenTab',\n  MatchedExpression = 'reasonKeep',\n\}\n/, '\n');
          if (!cleanupTypes.includes("type ReasonKeep = import('./Enums').ReasonKeep;")) {
            cleanupTypes = cleanupTypes.replace(
              "type ReasonClean = import('./Enums').ReasonClean;",
              "type ReasonKeep = import('./Enums').ReasonKeep;\ntype ReasonClean = import('./Enums').ReasonClean;",
            );
          }
          fs.writeFileSync('src/typings/Cleanup.d.ts', cleanupTypes);

          let libs = fs.readFileSync('src/services/Libs.ts', 'utf8');
          libs = libs.replace(
            "import { browserName, SiteDataType, SettingID, ListType } from '../typings/Enums';",
            "import { browserName, SiteDataType, SettingID, ListType, EventListenerAction } from '../typings/Enums';",
          );
          fs.writeFileSync('src/services/Libs.ts', libs);

          let libsSpec = fs.readFileSync('__tests__/services/Libs.spec.ts', 'utf8');
          libsSpec = libsSpec.replace(
            "import { browserName, SiteDataType, SettingID, ListType } from '../../src/typings/Enums';",
            "import { browserName, SiteDataType, SettingID, ListType, EventListenerAction } from '../../src/typings/Enums';",
          );
          fs.writeFileSync('__tests__/services/Libs.spec.ts', libsSpec);

          let cleanupService = fs.readFileSync('src/services/CleanupService.ts', 'utf8');
          cleanupService = cleanupService.replace(
            "import { browserName, SiteDataType, SettingID, ListType, ReasonClean, OpenTabStatus } from '../typings/Enums';",
            "import { browserName, SiteDataType, SettingID, ListType, ReasonClean, ReasonKeep, OpenTabStatus } from '../typings/Enums';",
          );
          fs.writeFileSync('src/services/CleanupService.ts', cleanupService);

          let cleanupSpec = fs.readFileSync('__tests__/services/CleanupService.spec.ts', 'utf8');
          cleanupSpec = cleanupSpec.replace(
            "import { browserName, SiteDataType, SettingID, ListType, ReasonClean, OpenTabStatus } from '../../src/typings/Enums';",
            "import { browserName, SiteDataType, SettingID, ListType, ReasonClean, ReasonKeep, OpenTabStatus } from '../../src/typings/Enums';",
          );
          fs.writeFileSync('__tests__/services/CleanupService.spec.ts', cleanupSpec);

          let activityTable = fs.readFileSync('src/ui/common_components/ActivityTable.tsx', 'utf8');
          activityTable = activityTable.replace(
            "import { FilterOptions, ListType, ReasonClean, SettingID, SiteDataType } from '../../typings/Enums';",
            "import { FilterOptions, ListType, ReasonClean, ReasonKeep, SettingID, SiteDataType } from '../../typings/Enums';",
          );
          fs.writeFileSync('src/ui/common_components/ActivityTable.tsx', activityTable);

          let background = fs.readFileSync('src/background.ts', 'utf8');
          background = background.replace(
            "import { browserName, SettingID } from './typings/Enums';",
            "import { browserName, SettingID, EventListenerAction } from './typings/Enums';",
          );
          fs.writeFileSync('src/background.ts', background);
          NODE

          cat > tools/jest-typescript-transformer.cjs <<'EOF'
          const ts = require('typescript');

          module.exports = {
            process(sourceText, sourcePath) {
              return ts.transpileModule(sourceText, {
                fileName: sourcePath,
                compilerOptions: {
                  allowSyntheticDefaultImports: true,
                  esModuleInterop: true,
                  jsx: ts.JsxEmit.React,
                  module: ts.ModuleKind.CommonJS,
                  sourceMap: true,
                  target: ts.ScriptTarget.ES2017,
                },
              }).outputText;
            },
          };
          EOF

          cat > src/typings/BrowserRuntime.d.ts <<'EOF'
          /// <reference path="../../node_modules/@types/firefox-webext-browser/index.d.ts" />

          /**
           * TypeScript 7 with bundler module resolution keeps the Firefox WebExtension
           * declaration namespaces but does not expose a global runtime `browser` value.
           *
           * Keep the maintained Firefox declarations as the source of truth and derive
           * the runtime surface CAD uses from those namespaces. The explicit reference
           * prevents module-resolution changes from silently dropping the ambient base.
           */
          type CadBrowserRuntime = {
            tabs: typeof browser.tabs;
            runtime: typeof browser.runtime;
            cookies: typeof browser.cookies;
            storage: typeof browser.storage;
            browsingData: typeof browser.browsingData;
            contextualIdentities: typeof browser.contextualIdentities;
            notifications: typeof browser.notifications;
            alarms: typeof browser.alarms;
            commands: typeof browser.commands;
            management: typeof browser.management;
            permissions: typeof browser.permissions;
            windows: typeof browser.windows;
            i18n: typeof browser.i18n;
            contextMenus: typeof browser.contextMenus;
            sessions: typeof browser.sessions;
            browserAction: typeof browser.browserAction;
            extension: typeof browser.extension;
          };

          declare const browser: CadBrowserRuntime;
          EOF

          npm install --package-lock-only --ignore-scripts --legacy-peer-deps
          npm ci --legacy-peer-deps
          npm ls @types/firefox-webext-browser @typescript/native typescript @types/node @types/jest || true
      - name: TypeScript 7 typecheck
        run: npx tsc --noEmit
      - name: Jest suite
        run: npm test -- --runInBand
      - name: ESLint
        run: npm run lint
      - name: Prettier changed files
        run: npx prettier --check package.json tsconfig.json jest.config.js src/typings/BrowserRuntime.d.ts src/typings/Enums.ts src/typings/Global.d.ts src/typings/Cleanup.d.ts src/services/Libs.ts src/services/CleanupService.ts src/background.ts src/ui/common_components/ActivityTable.tsx __tests__/services/Libs.spec.ts __tests__/services/CleanupService.spec.ts tools/jest-typescript-transformer.cjs
      - name: Firefox build
        run: npm run dev:firefox
      - name: Chromium build
        run: npm run dev:chromium
      - name: Commit validated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-ts7-coordinated-migration.yml
          git add package.json package-lock.json tsconfig.json jest.config.js tools/jest-typescript-transformer.cjs src/typings/BrowserRuntime.d.ts src/typings/Enums.ts src/typings/Global.d.ts src/typings/Cleanup.d.ts src/services/Libs.ts src/services/CleanupService.ts src/background.ts src/ui/common_components/ActivityTable.tsx __tests__/services/Libs.spec.ts __tests__/services/CleanupService.spec.ts
          git commit -m "chore: migrate toolchain to TypeScript 7"
          git push origin HEAD:modernization-p0
