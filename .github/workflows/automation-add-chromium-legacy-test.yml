name: automation add Chromium legacy upgrade test
on:
  push:
    branches: [modernization-p0]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add Chromium legacy regression and run focused suite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('__tests__/services/SettingService.spec.ts')
          s = p.read_text()
          marker = "    it('should init if not yet initialized', async () => {"
          test = '''    it('should tolerate a Chromium legacy profile while a site-data cleanup setting is still missing', async () => {
      const { [SettingID.CLEANUP_CACHE]: _missingCleanupCache, ...legacySettings } =
        initialState.settings;
      const legacyStore: Store<State, ReduxAction> = createStore({
        ...initialState,
        settings: legacySettings,
      });
      legacyStore.dispatch({
        type: ReduxConstants.ADD_CACHE,
        payload: { key: 'browserDetect', value: browserName.Chrome },
      });
      legacyStore.dispatch({
        type: ReduxConstants.ADD_CACHE,
        payload: { key: 'browserVersion', value: 140 },
      });
      StoreUser.init(legacyStore);
      SettingService.init();

      legacyStore.dispatch(updateSetting({ name: SettingID.ACTIVE_MODE, value: true }));

      await expect(SettingService.onSettingsChange()).resolves.toBeUndefined();
      expect(global.browser.browsingData.remove).not.toHaveBeenCalled();

      StoreUser.init(store);
      SettingService.init();
    });

'''
          if 'should tolerate a Chromium legacy profile while a site-data cleanup setting is still missing' not in s:
              if marker not in s:
                  raise SystemExit('insertion marker not found')
              s = s.replace(marker, test + marker, 1)
              p.write_text(s)
          PY
          npm ci
          npx jest __tests__/services/SettingService.spec.ts --runInBand
      - name: Commit regression test
        shell: bash
        run: |
          git config user.name HyperCriSiS
          git config user.email dev.github@w3b.world
          git add __tests__/services/SettingService.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: cover Chromium legacy settings upgrade'
          git push origin HEAD:modernization-p0
