name: automation inspect list upgrades
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect persisted list hydration and tests
        shell: bash
        run: |
          echo '=== StateHydration.spec.ts ==='
          sed -n '1,260p' __tests__/services/StateHydration.spec.ts
          echo '=== StatePersistence.spec.ts ==='
          sed -n '1,280p' __tests__/services/StatePersistence.spec.ts
          echo '=== allow/grey list references in services/tests ==='
          grep -RInE "allowlist|greylist|whitelist|graylist|greyList|whiteList|allowList" src __tests__ --include='*.ts' | head -n 320 || true
