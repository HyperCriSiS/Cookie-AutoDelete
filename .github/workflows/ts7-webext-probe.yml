name: TS7 WebExtension typings probe

on:
  push:
    branches:
      - modernization-p0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prepare isolated TS7 typing probe
        run: |
          mv src/typings/Webext.d.ts /tmp/Webext.d.ts
          mkdir .ts7-probe
          cd .ts7-probe
          npm init -y
          npm install --save-dev typescript@7.0.2 @types/firefox-webext-browser@latest @types/node@latest
      - name: Compile without legacy WebExtension declarations
        shell: bash
        run: |
          cat > tsconfig.ts7-probe.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "types": ["firefox-webext-browser", "node"],
              "typeRoots": ["./.ts7-probe/node_modules/@types", "./src/typings"]
            }
          }
          EOF
          ./.ts7-probe/node_modules/.bin/tsc -p tsconfig.ts7-probe.json --noEmit
