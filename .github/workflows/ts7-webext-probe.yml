name: TS7 WebExtension typings probe

on:
  push:
    branches:
      - modernization-p0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install isolated TS7 typing probe dependencies
        run: npm install --no-save --no-package-lock typescript@7.0.2 @types/firefox-webext-browser@latest
      - name: Compile with Firefox WebExtension typings
        shell: bash
        run: |
          cat > tsconfig.ts7-probe.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "module": "Node16",
              "moduleResolution": "Node16",
              "types": ["firefox-webext-browser"],
              "typeRoots": ["./node_modules/@types", "./src/typings"]
            }
          }
          EOF
          npx tsc -p tsconfig.ts7-probe.json --noEmit
