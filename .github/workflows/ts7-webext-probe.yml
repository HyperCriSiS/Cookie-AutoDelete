name: TS7 WebExtension typings probe

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/ts7-webext-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Isolate maintained WebExtension typings under TypeScript 7
        shell: bash
        run: |
          set -euxo pipefail
          mv src/typings/Webext.d.ts /tmp/Webext.d.ts
          mkdir -p ts7-probe
          cd ts7-probe
          npm init -y >/dev/null
          npm install --save-dev typescript@7.0.2 @types/firefox-webext-browser@latest @types/jest@latest >/dev/null
          cd ..
          cat > tsconfig.ts7-probe.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "types": ["firefox-webext-browser", "jest"],
              "typeRoots": ["./ts7-probe/node_modules/@types", "./src/typings"]
            }
          }
          EOF
          ./ts7-probe/node_modules/.bin/tsc -p tsconfig.ts7-probe.json --noEmit
