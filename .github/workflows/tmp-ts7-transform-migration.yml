name: Temporary TypeScript 7 transform migration

on:
  push:
    branches: [modernization-p0]
    paths: ['.github/workflows/tmp-ts7-transform-migration.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --legacy-peer-deps
      - name: Show used browser namespaces
        run: grep -RhoE 'browser\.[A-Za-z_][A-Za-z0-9_]*' src test* 2>/dev/null | sort -u || true
      - name: Test typed runtime declaration under TS7
        run: |
          npm install --no-save --legacy-peer-deps typescript@7.0.2
          node <<'NODE'
          const fs=require('fs');
          let t=fs.readFileSync('tsconfig.json','utf8').replace('"module": "commonjs"','"module": "esnext"').replace('"moduleResolution": "node"','"moduleResolution": "bundler"');
          fs.writeFileSync('tsconfig.json',t);
          fs.appendFileSync('src/typings/Webext.d.ts', `\n\ntype CadBrowserApi = {\n  alarms: typeof browser.alarms;\n  browserAction: typeof browser.browserAction;\n  browsingData: typeof browser.browsingData;\n  contextualIdentities: typeof browser.contextualIdentities;\n  cookies: typeof browser.cookies;\n  extension: typeof browser.extension;\n  i18n: typeof browser.i18n;\n  notifications: typeof browser.notifications;\n  permissions: typeof browser.permissions;\n  runtime: typeof browser.runtime;\n  storage: typeof browser.storage;\n  tabs: typeof browser.tabs;\n  windows: typeof browser.windows;\n};\ndeclare const browser: CadBrowserApi;\n`);
          NODE
          npx tsc --noEmit
