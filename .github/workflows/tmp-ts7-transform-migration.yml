name: Temporary TypeScript 7 transform migration

on:
  push:
    branches:
      - modernization-p0
    paths:
      - '.github/workflows/tmp-ts7-transform-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install current dependencies
        run: npm ci --legacy-peer-deps
      - name: Apply TypeScript 7 and SWC Jest migration
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall --save-dev ts-jest --legacy-peer-deps
          npm install --save-dev --save-exact typescript@7.0.2 @swc/core @swc/jest --legacy-peer-deps
          node <<'NODE'
          const fs = require('fs');
          const path = 'jest.config.js';
          let s = fs.readFileSync(path, 'utf8');
          s = s.replace(/\n\s*globals:\s*\{\s*'ts-jest':\s*\{\s*tsconfig:\s*'tsconfig\.json',?\s*\},?\s*\},?/m, '');
          s = s.replace(/\n\s*preset:\s*'ts-jest',?/m, '');
          s = s.replace("'^.+\\\\.tsx?$': 'ts-jest'", "'^.+\\\\.tsx?$': ['@swc/jest', { jsc: { parser: { syntax: 'typescript', tsx: true }, target: 'es2017', transform: { react: { runtime: 'automatic' } } }, module: { type: 'commonjs' } }]");
          if (s.includes('ts-jest')) throw new Error('ts-jest reference remains in jest.config.js');
          fs.writeFileSync(path, s);
          NODE
          echo '--- dependency versions ---'
          node -e "const p=require('./package.json'); console.log(JSON.stringify({typescript:p.devDependencies.typescript,swcCore:p.devDependencies['@swc/core'],swcJest:p.devDependencies['@swc/jest'],tsJest:p.devDependencies['ts-jest']},null,2))"
      - name: Typecheck TypeScript 7 using existing CommonJS resolution
        id: first_typecheck
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Retry only with explicit legacy-resolution deprecation acknowledgement
        if: steps.first_typecheck.outcome == 'failure'
        run: npx tsc --noEmit --ignoreDeprecations 6.0
      - name: Run Jest suite through SWC
        run: npm test -- --runInBand
      - name: Lint
        run: npm run lint
      - name: Build webpack bundle
        run: npm run compile
      - name: Verify migration diff
        run: |
          git diff --check
          test -z "$(grep -R "ts-jest" -n package.json jest.config.js package-lock.json || true)"
