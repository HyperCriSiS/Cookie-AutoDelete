name: Temporary TypeScript 7 transform migration

on:
  push:
    branches:
      - modernization-p0
    paths:
      - '.github/workflows/tmp-ts7-transform-migration.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --legacy-peer-deps
      - name: Inspect browser declarations
        run: |
          echo '--- local Webext.d.ts ---'
          cat src/typings/Webext.d.ts
          echo '--- package declaration header/footer/browser value markers ---'
          grep -n -E 'export as namespace|export =|declare (const|var|namespace) browser|namespace browser' node_modules/@types/firefox-webext-browser/index.d.ts | head -40 || true
          head -40 node_modules/@types/firefox-webext-browser/index.d.ts
          tail -40 node_modules/@types/firefox-webext-browser/index.d.ts
