name: Temporary TypeScript 7 transform migration

on:
  push:
    branches:
      - modernization-p0
    paths:
      - '.github/workflows/tmp-ts7-transform-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Inspect current migration surface
        run: |
          echo '--- package dependencies ---'
          node -e "const p=require('./package.json'); console.log(JSON.stringify({typescript:p.devDependencies.typescript,tsJest:p.devDependencies['ts-jest'],jest:p.devDependencies.jest},null,2))"
          echo '--- jest transform/config references ---'
          grep -n -C 6 -E 'ts-jest|transform|globals|preset' jest.config.js || true
          echo '--- tsconfig ---'
          cat tsconfig.json
