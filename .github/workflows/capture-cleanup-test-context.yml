name: Capture cleanup test context

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/capture-cleanup-test-context.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernization-p0
      - name: Capture focused test context
        run: |
          {
            echo '=== lines 380-455 ==='
            sed -n '380,455p' __tests__/services/CleanupService.spec.ts
            echo '=== cookies.remove references ==='
            grep -n -C 3 'cookies.remove' __tests__/services/CleanupService.spec.ts || true
          } > cleanup-test-context.txt
      - name: Commit context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cleanup-test-context.txt
          git commit -m "chore: capture cleanup test context"
          git push origin HEAD:modernization-p0