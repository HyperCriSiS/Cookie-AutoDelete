name: Temporary maintained WebExtension typing migration

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/tmp-maintained-webext-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: modernization-p0
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install baseline dependencies
        run: npm ci --prefer-offline --no-fund
      - name: Apply maintained WebExtension typing migration
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall --save-dev web-ext-types
          npm install --save-dev @types/firefox-webext-browser@143.0.0

          python3 - <<'PY'
          from pathlib import Path

          tsconfig = Path('tsconfig.json')
          text = tsconfig.read_text()
          legacy_root = '      "node_modules/web-ext-types",\n'
          if text.count(legacy_root) != 1:
              raise SystemExit('Expected legacy web-ext-types typeRoot exactly once')
          text = text.replace(legacy_root, '', 1)
          marker = '    "noFallthroughCasesInSwitch": true /* Report errors for fallthrough cases in switch statement. */,\n'
          if text.count(marker) != 1:
              raise SystemExit('Expected noFallthroughCasesInSwitch marker exactly once')
          text = text.replace(
              marker,
              marker + '    "skipLibCheck": true /* Third-party declaration compatibility is migrated separately; application use-sites remain checked. */,\n',
              1,
          )
          tsconfig.write_text(text)

          fixture = Path('__tests__/services/ContextualIdentitiesEvents.spec.ts')
          ftext = fixture.read_text()
          old_fixture = "    icon: 'fingerprint',\n    name: 'Testing Container',"
          new_fixture = "    icon: 'fingerprint',\n    iconUrl: 'resource://usercontext-content/fingerprint.svg',\n    colorCode: '#37adff',\n    name: 'Testing Container',"
          if ftext.count(old_fixture) != 1:
              raise SystemExit('Expected contextual identity fixture exactly once')
          fixture.write_text(ftext.replace(old_fixture, new_fixture, 1))

          settings = Path('src/ui/settings/App.tsx')
          stext = settings.read_text()
          old_settings = '    const tab = await browser.tabs.getCurrent();\n    const tabURL = new URL(tab.url || \'\');'
          new_settings = "    const tab = await browser.tabs.getCurrent();\n    if (!tab) {\n      return;\n    }\n    const tabURL = new URL(tab.url || '');"
          if stext.count(old_settings) != 1:
              raise SystemExit('Expected settings getCurrent lookup exactly once')
          settings.write_text(stext.replace(old_settings, new_settings, 1))
          PY

          cat > src/typings/Webext.d.ts <<'EOF'
          /* eslint-disable @typescript-eslint/no-unused-vars */
          /**
           * Copyright (c) 2017-2022 Kenny Do and CAD Team (https://github.com/Cookie-AutoDelete/Cookie-AutoDelete/graphs/contributors)
           * Licensed under MIT (https://github.com/Cookie-AutoDelete/Cookie-AutoDelete/blob/3.X.X-Branch/LICENSE)
           *
           * THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
           * IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
           * FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
           * AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
           * LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
           * OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
           * SOFTWARE.
           */

          /** Cross-browser compatibility additions on top of @types/firefox-webext-browser. */
          interface EvListener<T extends (...args: any[]) => any> {
            addListener(callback: T): void;
            removeListener(callback: T): void;
            hasListener(callback: T): boolean;
          }

          declare namespace browser.cookies {
            type CookiePartitionKey = PartitionKey;
          }

          /**
           * Cross-browser cookie shape used inside CAD. Firefox exposes
           * `firstPartyDomain`, while Chromium cookies may omit it entirely.
           */
          type CadCookie = Omit<
            browser.cookies.Cookie,
            'firstPartyDomain' | 'partitionKey'
          > & {
            firstPartyDomain?: string;
            partitionKey?: browser.cookies.CookiePartitionKey;
          };

          declare namespace browser.contextualIdentities {
            type contextualIdentitiesChangeInfo = {
              contextualIdentity: ContextualIdentity;
            };
          }

          declare namespace browser.tabs {
            interface Tab {
              selected?: boolean;
            }

            interface TabChangeInfo extends _OnUpdatedChangeInfo {
              cookieChanged?: {
                removed: boolean;
                cookie: CadCookie;
                cause: browser.cookies.OnChangedCause;
              };
            }
          }
          EOF

          git diff --check
          npm ls @types/firefox-webext-browser web-ext-types || true
      - name: Verify application typecheck
        run: npx tsc --noEmit --pretty false
      - name: Verify tests
        run: npm test -- --runInBand
      - name: Verify lint
        run: npm run lint
      - name: Verify Firefox webpack build
        run: npx webpack --config webpack.config.js --env browser=firefox
      - name: Verify Chromium webpack build
        run: npx webpack --config webpack.config.js --env browser=chromium
      - name: Commit validated migration
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          if git diff --quiet; then
            echo 'No migration changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json tsconfig.json src/typings/Webext.d.ts __tests__/services/ContextualIdentitiesEvents.spec.ts src/ui/settings/App.tsx
          git commit -m 'refactor: use maintained WebExtension typings'
          git push origin HEAD:modernization-p0
