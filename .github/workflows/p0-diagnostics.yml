name: P0 Diagnostics

on:
  push:
    branches:
      - modernization-p0

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Run tests and capture failure
        id: tests
        shell: bash
        run: |
          set +e
          npm run test -- --runInBand --verbose > /tmp/p0-tests.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report failing test output to PR
        if: steps.tests.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### P0 diagnostics: failing test output'
            echo
            echo '```text'
            tail -n 160 /tmp/p0-tests.log
            echo '```'
          } > /tmp/p0-comment.md
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/p0-comment.md
          exit 1
      - name: Run lint and build when tests pass
        if: steps.tests.outputs.exit_code == '0'
        shell: bash
        run: |
          npm run lint
          npm run build
