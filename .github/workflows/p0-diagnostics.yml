name: P0 Diagnostics

on:
  push:
    branches:
      - modernization-p0

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair exact malformed legacy test patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('__tests__/services/CleanupService.spec.ts')
          text = path.read_text()
          broken = """          [],
        expect(spyCleanupService.cleanSiteData).not.toHaveBeenCalled();edTimes(1);"""
          fixed = """          [],
        );
        expect(spyCleanupService.cleanSiteData).not.toHaveBeenCalled();"""

          count = text.count(broken)
          if count > 1:
              raise SystemExit(f'Expected at most one malformed pluginData block, found {count}')
          if count == 1:
              path.write_text(text.replace(broken, fixed, 1))
          PY

          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add __tests__/services/CleanupService.spec.ts
            git commit -m 'test: repair pluginData regression expectation'
            git push origin HEAD:modernization-p0
          fi

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install locked dependencies
        run: npm ci --no-fund

      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          npm run test -- --runInBand --verbose > /tmp/p0-tests.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report test failure
        if: steps.tests.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### P0 diagnostics: tests failed'
            echo
            echo '```text'
            tail -n 220 /tmp/p0-tests.log
            echo '```'
          } > /tmp/p0-comment.md
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/p0-comment.md
          exit 1

      - name: Run lint
        if: steps.tests.outputs.exit_code == '0'
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/p0-lint.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report lint failure
        if: steps.tests.outputs.exit_code == '0' && steps.lint.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### P0 diagnostics: lint failed'
            echo
            echo '```text'
            tail -n 220 /tmp/p0-lint.log
            echo '```'
          } > /tmp/p0-comment.md
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/p0-comment.md
          exit 1

      - name: Run build
        if: steps.tests.outputs.exit_code == '0' && steps.lint.outputs.exit_code == '0'
        id: build
        shell: bash
        run: |
          set +e
          npm run build > /tmp/p0-build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report build failure
        if: steps.tests.outputs.exit_code == '0' && steps.lint.outputs.exit_code == '0' && steps.build.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### P0 diagnostics: build failed'
            echo
            echo '```text'
            tail -n 260 /tmp/p0-build.log
            echo '```'
          } > /tmp/p0-comment.md
          gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/p0-comment.md
          exit 1

      - name: Confirm P0 diagnostics
        if: steps.tests.outputs.exit_code == '0' && steps.lint.outputs.exit_code == '0' && steps.build.outputs.exit_code == '0'
        run: echo 'Tests, lint, and build passed.'
