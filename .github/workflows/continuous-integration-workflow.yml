name: CI

on:
  push:
    branches:
      - p0-repair

permissions:
  contents: write

jobs:
  repair:
    name: P0 Repair
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: p0-repair
          fetch-depth: 0

      - name: Apply exact cleanup test repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('__tests__/services/CleanupService.spec.ts')
          text = path.read_text()
          changed = False

          broken = """          [],
        expect(spyCleanupService.cleanSiteData).not.toHaveBeenCalled();edTimes(1);"""
          fixed = """          [],
        );
        expect(spyCleanupService.cleanSiteData).not.toHaveBeenCalled();"""
          count = text.count(broken)
          if count > 1:
              raise SystemExit(f'Malformed pluginData block is not unique: {count}')
          if count == 1:
              text = text.replace(broken, fixed, 1)
              changed = True

          marker = """  describe('cleanCookiesOperation()', () => {
    const cleanupProperties: CleanupProperties = {
      greyCleanup: false,
      ignoreOpenTabs: false,
    };
    beforeEach(() => {
      when(global.browser.tabs.query)"""
          replacement = """  describe('cleanCookiesOperation()', () => {
    const cleanupProperties: CleanupProperties = {
      greyCleanup: false,
      ignoreOpenTabs: false,
    };
    beforeEach(() => {
      when(global.browser.cookies.remove)
        .calledWith(expect.any(Object))
        .mockResolvedValue({} as never);
      when(global.browser.tabs.query)"""
          count = text.count(marker)
          if count > 1:
              raise SystemExit(f'cleanCookiesOperation setup is not unique: {count}')
          if count == 1:
              text = text.replace(marker, replacement, 1)
              changed = True

          if changed:
              path.write_text(text)
          PY

          git diff --check
          git diff -- __tests__/services/CleanupService.spec.ts

      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet -- __tests__/services/CleanupService.spec.ts; then
            echo 'Repair already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add __tests__/services/CleanupService.spec.ts
          git commit -m 'test: finalize cleanup P0 regressions'
          git push origin HEAD:p0-repair
