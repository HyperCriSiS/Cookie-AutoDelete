name: CI

on:
  push:
    branches:
      - '3.X.X-Branch'
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches-ignore:
      - '_archived__**'
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  all_jobs:
    name: Tests, Builds, Coverage
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'l10n_') }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-fund
      - name: Run TypeScript 7 typecheck
        run: npm run typecheck
      - name: Run Tests
        run: npm run test -- --verbose
      - name: Run Lint
        run: npm run lint
      - name: Run Build
        run: npm run build
        env:
          GITSHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload packages for real-browser E2E
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-packages
          path: |
            builds/*Chrome.zip
            builds/*Firefox.xpi
          if-no-files-found: error
          retention-days: 3
      - name: Archive Code Coverage Results
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage

  browser_e2e_chromium:
    name: Browser E2E — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: all_jobs
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
      - name: Use Node.js 24 for browser automation
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache E2E npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-e2e-npm-${{ hashFiles('tests/e2e/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-e2e-npm-
      - name: Install isolated E2E dependencies
        run: npm run test:e2e:install
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('tests/e2e/package.json') }}
      - name: Install Playwright Chromium and Linux dependencies
        run: npm --prefix tests/e2e exec -- playwright install --with-deps chromium
      - name: Allow the controlled E2E server to bind HTTP port 80
        run: sudo setcap 'cap_net_bind_service=+ep' "$(readlink -f "$(command -v node)")"
      - name: Download exact packaged browser candidates
        uses: actions/download-artifact@v8
        with:
          name: browser-test-packages
          path: builds/e2e-packages
      - name: Extract packaged Chromium candidate
        run: |
          CHROME_ZIP=$(find builds/e2e-packages -maxdepth 1 -name '*Chrome.zip' -print -quit)
          test -n "$CHROME_ZIP"
          mkdir -p builds/e2e-chromium
          unzip -q "$CHROME_ZIP" -d builds/e2e-chromium
      - name: Run real-browser Chromium E2E
        run: npm run test:e2e:chromium -- builds/e2e-chromium
      - name: Upload Chromium E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-chromium-results
          path: tests/e2e/results/
          if-no-files-found: warn
          retention-days: 14

  browser_e2e_firefox:
    name: Browser E2E — Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: all_jobs
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
      - name: Use Node.js 24 for browser automation
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache E2E npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-e2e-npm-${{ hashFiles('tests/e2e/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-e2e-npm-
      - name: Install isolated E2E dependencies
        run: npm run test:e2e:install
      - name: Resolve current Firefox version
        id: firefox-version
        run: |
          VERSION=$(
            curl --fail --silent --show-error --retry 4 \
              'https://product-details.mozilla.org/1.0/firefox_versions.json' |
              jq -r '.LATEST_FIREFOX_VERSION'
          )
          test -n "$VERSION"
          test "$VERSION" != "null"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache current Firefox archive
        uses: actions/cache@v6
        with:
          path: ~/.cache/cad-firefox
          key: ${{ runner.os }}-firefox-${{ steps.firefox-version.outputs.version }}
      - name: Install current Mozilla Firefox
        env:
          FIREFOX_VERSION: ${{ steps.firefox-version.outputs.version }}
        run: |
          mkdir -p "$HOME/.cache/cad-firefox"
          FIREFOX_ARCHIVE="$HOME/.cache/cad-firefox/firefox-${FIREFOX_VERSION}.tar.xz"
          if [[ ! -s "$FIREFOX_ARCHIVE" ]]; then
            curl --fail --location --retry 4 \
              'https://download.mozilla.org/?product=firefox-latest&os=linux64&lang=en-US' \
              --output "$FIREFOX_ARCHIVE"
          fi
          sudo rm -rf /opt/cad-firefox
          sudo mkdir -p /opt/cad-firefox
          sudo tar -xJf "$FIREFOX_ARCHIVE" -C /opt/cad-firefox --strip-components=1
          test -x /opt/cad-firefox/firefox
          echo 'FIREFOX_BIN=/opt/cad-firefox/firefox' >> "$GITHUB_ENV"
      - name: Allow the controlled E2E server to bind HTTP port 80
        run: sudo setcap 'cap_net_bind_service=+ep' "$(readlink -f "$(command -v node)")"
      - name: Download exact packaged browser candidates
        uses: actions/download-artifact@v8
        with:
          name: browser-test-packages
          path: builds/e2e-packages
      - name: Run real-browser Firefox E2E
        run: |
          FIREFOX_XPI=$(find builds/e2e-packages -maxdepth 1 -name '*Firefox.xpi' -print -quit)
          test -n "$FIREFOX_XPI"
          npm run test:e2e:firefox -- "$FIREFOX_XPI"
      - name: Upload Firefox E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-firefox-results
          path: tests/e2e/results/
          if-no-files-found: warn
          retention-days: 14

  release_candidate:
    name: Release Candidate Packages
    runs-on: ubuntu-latest
    needs:
      - all_jobs
      - browser_e2e_chromium
      - browser_e2e_firefox
    if: github.event_name == 'pull_request'
    steps:
      - name: Download exact browser-tested packages
        uses: actions/download-artifact@v8
        with:
          name: browser-test-packages
          path: builds
      - name: Create Release Candidate Checksums
        run: |
          cd builds
          sha256sum *Chrome.zip *Firefox.xpi > SHA256SUMS.txt
      - name: Upload Release Candidate Packages
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-packages
          path: |
            builds/*Chrome.zip
            builds/*Firefox.xpi
            builds/SHA256SUMS.txt
          if-no-files-found: error
      - name: Download published release candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-packages
          path: builds/rc-roundtrip
      - name: Verify package checksums after artifact roundtrip
        run: |
          cd builds/rc-roundtrip
          test -f SHA256SUMS.txt
          test "$(find . -maxdepth 1 -name '*Chrome.zip' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*Firefox.xpi' | wc -l)" -eq 1
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
          sha256sum -c SHA256SUMS.txt
      - name: Extract browser packages for convenience artifacts
        id: extbuilds
        run: |
          CHROME_ZIP=$(find builds -maxdepth 1 -name '*Chrome.zip' -print -quit)
          FIREFOX_XPI=$(find builds -maxdepth 1 -name '*Firefox.xpi' -print -quit)
          CHROME_DIR="${CHROME_ZIP%.zip}"
          FIREFOX_DIR="${FIREFOX_XPI%.xpi}"
          mkdir -p "$CHROME_DIR" "$FIREFOX_DIR"
          unzip -q "$CHROME_ZIP" -d "$CHROME_DIR"
          unzip -q "$FIREFOX_XPI" -d "$FIREFOX_DIR"
          echo "crdir=$(basename "$CHROME_DIR")" >> "$GITHUB_OUTPUT"
          echo "ffdir=$(basename "$FIREFOX_DIR")" >> "$GITHUB_OUTPUT"
      - name: Upload Artifact for Mozilla Firefox Build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extbuilds.outputs.ffdir }}
          path: builds/${{ steps.extbuilds.outputs.ffdir }}
      - name: Upload Artifact for Chromium Build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extbuilds.outputs.crdir }}
          path: builds/${{ steps.extbuilds.outputs.crdir }}
