name: CI

on:
  push:
    branches-ignore:
      - '_archived__**'
  pull_request:
    branches-ignore:
      - '_archived__**'
    paths-ignore:
      - '**/README.md'

permissions:
  contents: read

jobs:
  pre_info:
    name: Initial Checks
    runs-on: ubuntu-latest
    outputs:
      skipCI: ${{ steps.checkci.outputs.result }}
      gitSHA: ${{ steps.checkci.outputs.gitSHA }}
    steps:
      - name: Run CI Check
        id: checkci
        env:
          GH_API: ${{ github.event.repository.commits_url }}
          GH_TOKEN: ${{ github.token }}
          GH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Run ID    : $GITHUB_RUN_ID"
          echo "Event Name: $GITHUB_EVENT_NAME"
          echo "Branch    : $REF"
          echo "Commit SHA: $GH_SHA"
          echo "gitSHA=$GH_SHA" >> "$GITHUB_OUTPUT"

          SKIP_A=$([[ "$REF" == l10n_* ]] && echo true || echo false)
          echo "Starts With l10n_ : $SKIP_A"

          GH_API=${GH_API/'{/sha}'/}
          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(
            curl --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              "$GH_API/$GH_SHA" || true
          )

          CM=""
          if [[ "$HTTP_STATUS" == "200" ]] && \
            jq -e '.commit.message | type == "string"' "$RESPONSE_FILE" > /dev/null 2>&1; then
            CM=$(jq -r '.commit.message' "$RESPONSE_FILE")
          else
            echo "::warning::Could not read commit message from GitHub API (HTTP ${HTTP_STATUS:-unknown}); CI will run instead of failing."
          fi
          rm -f "$RESPONSE_FILE"

          echo "Commit Message: $CM"
          EXP_SKIP="\[ci skip\]"
          SKIP_B=$([[ "$CM" =~ $EXP_SKIP ]] && echo true || echo false)
          echo "Skip via Commit: $SKIP_B"

          RES=$([[ $SKIP_A == true || $SKIP_B == true ]] && echo true || echo false)
          echo "Skip CI: $RES"
          echo "result=$RES" >> "$GITHUB_OUTPUT"

  all_jobs:
    name: Tests, Builds, Coverage
    runs-on: ubuntu-latest
    needs: pre_info
    if: needs.pre_info.outputs.skipCI == 'false'
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
      - name: Use Node.js from .nvmrc
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Cache npm download cache
        id: nodeCache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-nodejs-${{ steps.node.outputs.node-version }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nodejs-${{ steps.node.outputs.node-version }}-npm-
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-fund
      - name: Run TypeScript 7 typecheck
        run: npm run typecheck
      - name: Run Tests
        run: npm run test -- --verbose
      - name: Run Lint
        run: npm run lint
      - name: Run Build
        run: npm run build
        env:
          GITSHA: ${{ needs.pre_info.outputs.gitSHA }}
      - name: Upload packages for real-browser E2E
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-packages
          path: |
            builds/*Chrome.zip
            builds/*Firefox.xpi
          if-no-files-found: error
          retention-days: 3
      - name: Archive Code Coverage Results
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage

  browser_e2e_chromium:
    name: Browser E2E — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - pre_info
      - all_jobs
    if: needs.pre_info.outputs.skipCI == 'false'
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
      - name: Use Node.js 24 for browser automation
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install isolated E2E dependencies
        run: npm run test:e2e:install
      - name: Install Playwright Chromium and Linux dependencies
        run: npm --prefix tests/e2e exec -- playwright install --with-deps chromium
      - name: Allow the controlled E2E server to bind HTTP port 80
        run: sudo setcap 'cap_net_bind_service=+ep' "$(readlink -f "$(command -v node)")"
      - name: Download exact packaged browser candidates
        uses: actions/download-artifact@v8
        with:
          name: browser-test-packages
          path: builds/e2e-packages
      - name: Extract packaged Chromium candidate
        run: |
          CHROME_ZIP=$(find builds/e2e-packages -maxdepth 1 -name '*Chrome.zip' -print -quit)
          test -n "$CHROME_ZIP"
          mkdir -p builds/e2e-chromium
          unzip -q "$CHROME_ZIP" -d builds/e2e-chromium
      - name: Run real-browser Chromium E2E
        run: npm run test:e2e:chromium -- builds/e2e-chromium
      - name: Upload Chromium E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-chromium-results
          path: tests/e2e/results/
          if-no-files-found: warn
          retention-days: 14

  browser_e2e_firefox:
    name: Browser E2E — Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - pre_info
      - all_jobs
    if: needs.pre_info.outputs.skipCI == 'false'
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
      - name: Use Node.js 24 for browser automation
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install isolated E2E dependencies
        run: npm run test:e2e:install
      - name: Install current Mozilla Firefox
        run: |
          curl --fail --location --retry 4 \
            'https://download.mozilla.org/?product=firefox-latest&os=linux64&lang=en-US' \
            --output /tmp/firefox.tar.xz
          sudo mkdir -p /opt/cad-firefox
          sudo tar -xJf /tmp/firefox.tar.xz -C /opt/cad-firefox --strip-components=1
          test -x /opt/cad-firefox/firefox
          echo 'FIREFOX_BIN=/opt/cad-firefox/firefox' >> "$GITHUB_ENV"
      - name: Allow the controlled E2E server to bind HTTP port 80
        run: sudo setcap 'cap_net_bind_service=+ep' "$(readlink -f "$(command -v node)")"
      - name: Download exact packaged browser candidates
        uses: actions/download-artifact@v8
        with:
          name: browser-test-packages
          path: builds/e2e-packages
      - name: Run real-browser Firefox E2E
        run: |
          FIREFOX_XPI=$(find builds/e2e-packages -maxdepth 1 -name '*Firefox.xpi' -print -quit)
          test -n "$FIREFOX_XPI"
          npm run test:e2e:firefox -- "$FIREFOX_XPI"
      - name: Upload Firefox E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-firefox-results
          path: tests/e2e/results/
          if-no-files-found: warn
          retention-days: 14

  release_candidate:
    name: Release Candidate Packages
    runs-on: ubuntu-latest
    needs:
      - pre_info
      - all_jobs
      - browser_e2e_chromium
      - browser_e2e_firefox
    if: github.event_name == 'pull_request' && needs.pre_info.outputs.skipCI == 'false'
    steps:
      - name: Download exact browser-tested packages
        uses: actions/download-artifact@v8
        with:
          name: browser-test-packages
          path: builds
      - name: Create Release Candidate Checksums
        run: |
          cd builds
          sha256sum *Chrome.zip *Firefox.xpi > SHA256SUMS.txt
      - name: Upload Release Candidate Packages
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-packages
          path: |
            builds/*Chrome.zip
            builds/*Firefox.xpi
            builds/SHA256SUMS.txt
          if-no-files-found: error
      - name: Extract browser packages for convenience artifacts
        id: extbuilds
        run: |
          CHROME_ZIP=$(find builds -maxdepth 1 -name '*Chrome.zip' -print -quit)
          FIREFOX_XPI=$(find builds -maxdepth 1 -name '*Firefox.xpi' -print -quit)
          CHROME_DIR="${CHROME_ZIP%.zip}"
          FIREFOX_DIR="${FIREFOX_XPI%.xpi}"
          mkdir -p "$CHROME_DIR" "$FIREFOX_DIR"
          unzip -q "$CHROME_ZIP" -d "$CHROME_DIR"
          unzip -q "$FIREFOX_XPI" -d "$FIREFOX_DIR"
          echo "crdir=$(basename "$CHROME_DIR")" >> "$GITHUB_OUTPUT"
          echo "ffdir=$(basename "$FIREFOX_DIR")" >> "$GITHUB_OUTPUT"
      - name: Upload Artifact for Mozilla Firefox Build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extbuilds.outputs.ffdir }}
          path: builds/${{ steps.extbuilds.outputs.ffdir }}
      - name: Upload Artifact for Chromium Build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extbuilds.outputs.crdir }}
          path: builds/${{ steps.extbuilds.outputs.crdir }}
