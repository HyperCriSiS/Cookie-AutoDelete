name: CI

on:
  push:
    branches-ignore:
      - '_archived__**'
      - 'l10n_*'
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  all_jobs:
    name: Tests, Builds, Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Default Commit
        uses: actions/checkout@v7
      - name: Use Node.js LTS 22.x
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-fund
      - name: Run Tests
        run: npm run test -- --verbose
      - name: Run Lint
        run: npm run lint
      - name: Run Build
        run: npm run build
        env:
          GITSHA: ${{ github.sha }}
      - name: Archive Code Coverage Results
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
