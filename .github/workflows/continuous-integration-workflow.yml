name: CI

on:
  push:
    branches-ignore:
      - '_archived__**'
  pull_request:
    branches-ignore:
      - '_archived__**'
    paths-ignore:
      - '**/README.md'

permissions:
  contents: read

jobs:
  pre_info:
    name: Initial Checks
    runs-on: ubuntu-latest
    outputs:
      skipCI: ${{ steps.checkci.outputs.result }}
      gitSHA: ${{ steps.checkci.outputs.gitSHA }}
    steps:
      - name: Run CI Check
        id: checkci
        env:
          GH_API: ${{ github.event.repository.commits_url }}
          GH_TOKEN: ${{ github.token }}
          GH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Run ID    : $GITHUB_RUN_ID"
          echo "Event Name: $GITHUB_EVENT_NAME"
          echo "Branch    : $REF"
          echo "Commit SHA: $GH_SHA"
          echo "gitSHA=$GH_SHA" >> "$GITHUB_OUTPUT"

          SKIP_A=$([[ "$REF" == l10n_* ]] && echo true || echo false)
          echo "Starts With l10n_ : $SKIP_A"

          GH_API=${GH_API/'{/sha}'/}
          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(
            curl --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              "$GH_API/$GH_SHA" || true
          )

          CM=""
          if [[ "$HTTP_STATUS" == "200" ]] && \
            jq -e '.commit.message | type == "string"' "$RESPONSE_FILE" > /dev/null 2>&1; then
            CM=$(jq -r '.commit.message' "$RESPONSE_FILE")
          else
            echo "::warning::Could not read commit message from GitHub API (HTTP ${HTTP_STATUS:-unknown}); CI will run instead of failing."
          fi
          rm -f "$RESPONSE_FILE"

          echo "Commit Message: $CM"
          EXP_SKIP="\[ci skip\]"
          SKIP_B=$([[ "$CM" =~ $EXP_SKIP ]] && echo true || echo false)
          echo "Skip via Commit: $SKIP_B"

          RES=$([[ $SKIP_A == true || $SKIP_B == true ]] && echo true || echo false)
          echo "Skip CI: $RES"
          echo "result=$RES" >> "$GITHUB_OUTPUT"

  all_jobs:
    name: Tests, Builds, Coverage
    runs-on: ubuntu-latest
    needs: pre_info
    if: needs.pre_info.outputs.skipCI == 'false'
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
      - name: Use Node.js from .nvmrc
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Cache npm download cache
        id: nodeCache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-nodejs-${{ steps.node.outputs.node-version }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nodejs-${{ steps.node.outputs.node-version }}-npm-
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-fund
      - name: Run TypeScript 7 typecheck
        run: npm run typecheck
      - name: Run Tests
        run: npm run test -- --verbose
      - name: Run Lint
        run: npm run lint
      - name: Run Build
        run: npm run build
        env:
          GITSHA: ${{ needs.pre_info.outputs.gitSHA }}
      - name: Create Release Candidate Checksums
        if: github.event_name == 'pull_request'
        run: |
          cd builds
          sha256sum *Chrome.zip *Firefox.xpi > SHA256SUMS.txt
      - name: Upload Release Candidate Packages
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-packages
          path: |
            builds/*Chrome.zip
            builds/*Firefox.xpi
            builds/SHA256SUMS.txt
          if-no-files-found: error
      - name: Archive Code Coverage Results
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
      - name: Extract zip builds for individual artifact upload
        if: github.event_name == 'pull_request'
        id: extbuilds
        run: |
          for i in *.zip; do echo "${i%.zip}"; done | xargs -I fn unzip fn.zip -d fn
          echo "ffdir=$(ls -d *Firefox)" >> "$GITHUB_OUTPUT"
          echo "crdir=$(ls -d *Chrome)" >> "$GITHUB_OUTPUT"
        working-directory: ./builds
      - name: Upload Artifact for Mozilla Firefox Build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extbuilds.outputs.ffdir }}
          path: builds/${{ steps.extbuilds.outputs.ffdir }}
      - name: Upload Artifact for Google Chrome Build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extbuilds.outputs.crdir }}
          path: builds/${{ steps.extbuilds.outputs.crdir }}
