name: automation inspect phase 2 upgrade

on:
  push:
    branches: [modernization-p0]
    paths: ['.github/workflows/automation-inspect-upgrade.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print upgrade context
        run: |
          echo '=== ROADMAP ==='
          cat ROADMAP.md
          echo '=== SettingService ==='
          sed -n '1,300p' src/services/SettingService.ts
          echo '=== StateHydration ==='
          sed -n '1,320p' src/services/StateHydration.ts
          echo '=== Site data references ==='
          grep -R "siteData\|otherBrowsingDataCleanup\|hasNewValue\|getSetting" -n src __tests__ | head -n 400 || true
          echo '=== Relevant tests ==='
          find __tests__ -type f \( -iname '*Setting*' -o -iname '*Hydration*' -o -iname '*Cleanup*' \) -print
