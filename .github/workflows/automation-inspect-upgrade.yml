name: automation inspect upgrade semantics
on:
  push:
    branches: [modernization-p0]
    paths: ['.github/workflows/automation-inspect-upgrade.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current upgrade paths
        run: |
          echo '=== ROADMAP ==='
          cat ROADMAP.md
          echo '=== SiteData upgrade block ==='
          sed -n '150,280p' src/services/SettingService.ts
          echo '=== getSetting/default objects ==='
          grep -n -A18 -B8 'export const getSetting' src/services/Libs.ts || true
          grep -n -A20 -B10 'siteData' src/services/Libs.ts | head -n 160 || true
          echo '=== SettingService tests around upgrades ==='
          grep -n -A35 -B20 -E 'previous|version|browsingData|missing|CleanupLocalStorage|CleanupIndexedDB|CleanupCaches' __tests__/services/SettingService.spec.ts | head -n 420 || true
