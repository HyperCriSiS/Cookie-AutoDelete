name: automation inspect upgrade semantics
on:
  push:
    branches: [modernization-p0]
    paths: ['.github/workflows/automation-inspect-upgrade.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect initialization and upgrade tests
        run: |
          set +e
          echo '=== ROADMAP ==='
          cat ROADMAP.md
          echo '=== SettingService init ==='
          sed -n '1,220p' src/services/SettingService.ts
          echo '=== validation/default helpers ==='
          grep -RIn -B16 -A45 -E 'validateSettings|defaultSettings|export const getSetting|export const siteData' src | head -n 800
          echo '=== upgrade tests ==='
          grep -n -B35 -A65 -E 'introduced after|migrating old setting|recently enabled|hasNewValue|older profile|missing' __tests__/services/SettingService.spec.ts | head -n 1000
