name: Temporary runtime enum roadmap finalization

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/tmp-runtime-enums-probe.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Update roadmap and remove temporary migration files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ROADMAP.md')
          text = p.read_text()

          old = "  - [ ] Replace the ambient global `declare const enum` dependency with explicit importable runtime-safe constants/enums, or choose a TypeScript-7-compatible Jest transform that preserves equivalent whole-program semantics; do not mask the problem with test-only globals."
          new = "  - [x] Replace the ambient global `declare const enum` dependency with explicit importable runtime-safe enums. `browserName`, `SiteDataType`, `SettingID`, `ListType`, `ReasonClean`, and `OpenTabStatus` now live as importable runtime values in `src/typings/Enums.ts`; application/test use-sites import them explicitly, while declaration files retain type aliases for compatibility. Production commit `86ec2fe8` passed repository typecheck, an isolated TypeScript 7.0.2 compile, the full Jest suite (37 suites / 409 tests), ESLint, Prettier, Firefox build, and Chromium build in validation run 32171063287."
          if old not in text:
              raise SystemExit('Expected open runtime-enum roadmap item not found')
          text = text.replace(old, new, 1)

          old_blocker = "Jest/type declarations are now modernized; the ambient `declare const enum`/Jest-transform dependency remains open engineering work."
          if old_blocker in text:
              text = text.replace(old_blocker, "Jest/type declarations and the ambient runtime-enum dependency are now modernized; the remaining TypeScript 7 work is the coordinated compiler/transform configuration migration and any compatibility defects exposed by the committed TS7 toolchain.", 1)

          old_completion = "The next TypeScript/toolchain step is the ambient const-enum/Jest-transform dependency, followed by any stricter application errors exposed after that migration."
          if old_completion in text:
              text = text.replace(old_completion, "The next TypeScript/toolchain step is removing obsolete `ts-jest`-specific configuration and committing the coordinated TypeScript 7 compiler/transform dependency changes, followed by the full validation matrix on that committed toolchain.", 1)

          p.write_text(text)
          PY
          git rm -f .github/scripts/tmp-runtime-enum-migration.py .github/workflows/tmp-runtime-enums-probe.yml
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add ROADMAP.md
          git diff --cached --check
          git status --short
          git commit -m 'docs: complete runtime enum migration'
          git push
