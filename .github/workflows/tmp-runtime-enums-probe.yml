name: Temporary runtime enum migration probe

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/tmp-runtime-enums-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show enum declarations and usage surface
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ambient const enum declarations ==='
          grep -RIn --include='*.d.ts' 'declare const enum' src/typings || true
          echo
          echo '=== relevant files ==='
          for file in src/typings/Global.d.ts src/typings/Cleanup.d.ts src/typings/Enums.ts __tests__/tsconfig.json tsconfig.json package.json; do
            if [ -f "$file" ]; then
              echo "--- $file ---"
              sed -n '1,360p' "$file"
            fi
          done
          echo
          echo '=== usage files and matching lines (src + tests) ==='
          for symbol in browserName SiteDataType SettingID ListType ReasonClean OpenTabStatus; do
            echo "--- $symbol ---"
            grep -RIn --include='*.ts' --include='*.tsx' --exclude='*.d.ts' -E "\\b${symbol}\\b" src __tests__ 2>/dev/null || true
          done
