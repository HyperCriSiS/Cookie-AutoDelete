name: Temporary runtime enum migration probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show enum declarations and usage surface
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ambient const enum declarations ==='
          grep -RIn --include='*.d.ts' 'declare const enum' src/typings || true
          echo
          echo '=== relevant typing files ==='
          for file in src/typings/Global.d.ts src/typings/Cleanup.d.ts src/typings/Settings.d.ts src/typings/Enums.ts __tests__/tsconfig.json tsconfig.json package.json; do
            echo "--- $file ---"
            sed -n '1,260p' "$file"
          done
          echo
          echo '=== usage counts (src + tests) ==='
          for symbol in browserName SiteDataType SettingID ListType ReasonClean OpenTabStatus; do
            echo "--- $symbol ---"
            grep -RIl --include='*.ts' --include='*.tsx' "$symbol" src __tests__ | sort || true
          done
