name: Temporary runtime enum migration probe

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/tmp-runtime-enums-probe.yml
      - .github/scripts/tmp-runtime-enum-migration.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Convert selected ambient const enums to runtime-safe imports
        run: python3 .github/scripts/tmp-runtime-enum-migration.py
      - name: Show migration diff
        run: git diff --stat && git diff -- src/typings/Enums.ts src/typings/Global.d.ts src/typings/Cleanup.d.ts | sed -n '1,360p'
      - name: Typecheck current compiler
        run: npx tsc --noEmit
      - name: Run Jest suite
        run: npm test -- --runInBand
      - name: Lint
        run: npm run lint
      - name: Build webpack bundle
        run: npm run compile
      - name: Typecheck runtime enum module with TypeScript 7
        run: npx --yes --package=typescript@7.0.2 tsc --ignoreConfig --noEmit --strict --target es2020 --module node16 --moduleResolution node16 src/typings/Enums.ts
      - name: Verify clean patch
        run: git diff --check
      - name: Commit validated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src __tests__
          git commit -m 'refactor: make shared enums runtime-safe'
          git push
