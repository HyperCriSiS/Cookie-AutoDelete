name: Temporary RC checklist status clarification

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/tmp-fix-rc-checklist-status.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: modernization-p0
      - name: Clarify merge-status gate
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('RC_TEST_CHECKLIST.md')
          t = p.read_text()
          old = "Before starting the final manual matrix, confirm PR #1 is mergeable with the current `3.X.X-Branch` base and that the candidate was generated **after** the most recent base synchronization/conflict resolution. If the base changes or the PR becomes non-mergeable, resolve/synchronize first, rerun CI, and record the replacement candidate instead of testing a stale artifact."
          new = "Before starting the final manual matrix, confirm PR #1 still targets the recorded current `3.X.X-Branch` base, has no real merge conflict/base drift, and that the candidate was generated **after** the most recent required base synchronization. The known external `github-advanced-security` AI-agent failure may make GitHub report `mergeable_state: unstable`; that external failure alone does not invalidate the candidate when regular CI, CodeQL and JavaScript/TypeScript/Actions analysis remain green. If the base changes or an actual merge conflict appears, resolve/synchronize first, rerun CI, and record the replacement candidate instead of testing a stale artifact."
          if t.count(old) != 1:
              raise SystemExit(f'expected one merge-status paragraph, found {t.count(old)}')
          p.write_text(t.replace(old, new, 1))
          PY
      - name: Commit checklist clarification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RC_TEST_CHECKLIST.md
          git diff --cached --check
          git commit -m 'docs: clarify RC merge-status gate'
          git push origin HEAD:modernization-p0
