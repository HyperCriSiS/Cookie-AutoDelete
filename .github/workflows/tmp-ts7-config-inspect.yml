name: Temporary TS7 migration config inspection

on:
  push:
    branches: [modernization-p0]
    paths: ['.github/workflows/tmp-ts7-config-inspect.yml']

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture relevant migration config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-ts7-config
          cp package.json .tmp-ts7-config/package.json.txt
          cp jest.config.js .tmp-ts7-config/jest.config.js.txt
          cp tsconfig.json .tmp-ts7-config/tsconfig.json.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-ts7-config
          git commit -m "chore: capture TS7 migration config"
          git push origin HEAD:modernization-p0
