name: automation validate Chromium legacy settings upgrade
on:
  push:
    branches: [modernization-p0]
    paths: ['.github/workflows/automation-validate-chromium-legacy.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernization-p0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Add Chromium legacy upgrade regression
        shell: python
        run: |
          from pathlib import Path
          p = Path('__tests__/services/SettingService.spec.ts')
          s = p.read_text()
          anchor = "    it('should init if not yet initialized', async () => {"
          test = """    it('should tolerate a Chromium legacy profile while a site-data cleanup setting is still missing', async () => {\n      const { [SettingID.CLEANUP_CACHE]: _missingCleanupCache, ...legacySettings } =\n        initialState.settings;\n      const legacyStore: Store<State, ReduxAction> = createStore({\n        ...initialState,\n        settings: legacySettings,\n      });\n      legacyStore.dispatch({\n        type: ReduxConstants.ADD_CACHE,\n        payload: { key: 'browserDetect', value: browserName.Chrome },\n      });\n      legacyStore.dispatch({\n        type: ReduxConstants.ADD_CACHE,\n        payload: { key: 'browserVersion', value: 140 },\n      });\n      StoreUser.init(legacyStore);\n      SettingService.init();\n\n      legacyStore.dispatch(updateSetting({ name: SettingID.ACTIVE_MODE, value: true }));\n\n      await expect(SettingService.onSettingsChange()).resolves.toBeUndefined();\n      expect(global.browser.browsingData.remove).not.toHaveBeenCalled();\n\n      StoreUser.init(store);\n      SettingService.init();\n    });\n\n"""
          if 'should tolerate a Chromium legacy profile' not in s:
              if anchor not in s:
                  raise SystemExit('anchor missing')
              p.write_text(s.replace(anchor, test + anchor, 1))
      - name: Run focused SettingService tests
        run: npx jest __tests__/services/SettingService.spec.ts --runInBand
      - name: Commit tested regression
        shell: bash
        run: |
          git config user.name HyperCriSiS
          git config user.email dev.github@w3b.world
          git add __tests__/services/SettingService.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'test: cover Chromium legacy settings upgrade'
            git push origin HEAD:modernization-p0
          fi
