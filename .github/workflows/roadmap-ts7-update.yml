name: Update TypeScript 7 roadmap findings

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/roadmap-ts7-update.yml

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record verified TypeScript 7 findings
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          text = p.read_text()
          old = "  - [ ] Replace the ambient global `declare const enum` dependency with explicit importable runtime-safe constants/enums, or choose a TypeScript-7-compatible Jest transform that preserves equivalent whole-program semantics; do not mask the problem with test-only globals."
          new = "  - [x] Probe TypeScript 7 whole-program compilation with `module`/`moduleResolution` moved to `Node16`: this clears the former TS5108 configuration gate but exposes broad type-ecosystem incompatibilities before emitted tests can be used. The dominant failures are stale WebExtension declarations (`browser.runtime`, `browser.tabs`, `browser.cookies`, `browser.i18n`, contextual identities) plus React/Redux declaration incompatibilities; a few stricter application-level TS7 errors also surface.\n  - [ ] Modernize the WebExtension and React/Redux type packages/configuration to versions compatible with the existing runtime libraries and TypeScript 7, then re-run the whole-program compile to separate declaration-package failures from real application typing defects.\n  - [ ] Replace the ambient global `declare const enum` dependency with explicit importable runtime-safe constants/enums, or choose a TypeScript-7-compatible Jest transform that preserves equivalent whole-program semantics; do not mask the problem with test-only globals. The ambient enum scope also includes `ReasonClean` and `OpenTabStatus`, so the fix must cover all ambient const-enum globals rather than only the four names first exposed by the SWC probe."
          if old not in text:
              raise SystemExit('Expected TypeScript 7 roadmap item not found')
          text = text.replace(old, new, 1)
          old_blocker = "- TypeScript 7 is no longer blocked merely by npm peer resolution once `ts-jest` is removed, but a compiler-independent SWC transform is not yet a drop-in replacement because the codebase relies on ambient `declare const enum` inlining (`browserName`, `SiteDataType`, `SettingID`, `ListType`). The TypeScript 7 path also requires replacing the removed legacy `moduleResolution=node10` configuration."
          new_blocker = "- TypeScript 7 is no longer blocked merely by npm peer resolution once `ts-jest` is removed. The removed legacy `moduleResolution=node10` setting can be moved to `Node16`, but the next compile gate is the outdated declaration ecosystem: current WebExtension and React/Redux typings generate broad TS7 errors. A compiler-independent SWC transform also remains non-equivalent because the codebase relies on ambient `declare const enum` inlining (`browserName`, `SiteDataType`, `SettingID`, `ListType`, `ReasonClean`, `OpenTabStatus`)."
          if old_blocker not in text:
              raise SystemExit('Expected TypeScript 7 blocker text not found')
          text = text.replace(old_blocker, new_blocker, 1)
          old_status = "**Not fully completed.** Manifest V3 foundations, functional CI stabilization, Archiver 8 / Redux 5 modernization and the automated migration/runtime compatibility pass are complete. The TypeScript 7 investigation has advanced from an install-time peer conflict to two concrete migration tasks: remove the obsolete `moduleResolution=node10` configuration and replace the ambient global `declare const enum` dependency (or use an equivalent TypeScript-7-compatible whole-program test transform) before the full toolchain can be committed and validated. Real historical-profile upgrade validation and packaged-browser release-candidate checks remain open."
          new_status = "**Not fully completed.** Manifest V3 foundations, functional CI stabilization, Archiver 8 / Redux 5 modernization and the automated migration/runtime compatibility pass are complete. TypeScript 7 is now proven to progress past the old `moduleResolution=node10` gate with `Node16`; the next concrete migration step is modernizing the stale WebExtension and React/Redux type declarations, then resolving the ambient const-enum/Jest-transform dependency and remaining stricter TS7 application errors. Real historical-profile upgrade validation and packaged-browser release-candidate checks remain open."
          if old_status not in text:
              raise SystemExit('Expected completion status not found')
          text = text.replace(old_status, new_status, 1)
          p.write_text(text)
          PY

      - name: Commit roadmap update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git diff --cached --check
          git commit -m "docs: record TypeScript 7 declaration blockers"
          git push
