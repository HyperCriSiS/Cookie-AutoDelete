name: Roadmap TypeScript 7 update

on:
  push:
    branches: [modernization-p0]
    paths:
      - '.github/workflows/roadmap-ts7-update.yml'

permissions:
  contents: write

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernization-p0
      - name: Record TypeScript 7 ecosystem gate
        shell: python
        run: |
          from pathlib import Path

          path = Path('ROADMAP.md')
          text = path.read_text()

          old = """  - [x] Identify the concrete install-time blocker from PR #7 CI: `ts-jest@26.5.6` declares peer `typescript >=3.8 <5.0`, so npm rejects `typescript@7.0.2` with `ERESOLVE`. `ts-loader@9.4.2` itself accepts `typescript@*` and is not the immediate peer conflict.\n  - [ ] Upgrade the Jest/TypeScript test toolchain coherently on `modernization-p0` (at minimum replace the obsolete `ts-jest@26.5.6`/Jest 26-era pairing with a TypeScript-7-compatible combination), regenerate the lockfile, then run the complete tests/lint/Firefox+Chromium build/package matrix. Do not use `--force` or `--legacy-peer-deps` as the migration solution."""
          new = """  - [x] Identify the concrete install-time blocker from PR #7 CI: `ts-jest@26.5.6` declares peer `typescript >=3.8 <5.0`, so npm rejects `typescript@7.0.2` with `ERESOLVE`. `ts-loader@9.4.2` itself accepts `typescript@*` and is not the immediate peer conflict.\n  - [x] Verify the current upstream `ts-jest` line is still not TypeScript-7-compatible: upstream `ts-jest` 29.4.12 declares peer `typescript >=4.3 <7` even while supporting Jest 29/30, so merely upgrading Jest/`ts-jest` cannot satisfy the TypeScript 7 gate.\n  - [ ] Replace `ts-jest` with a TypeScript-7-compatible test transform/toolchain (or otherwise decouple Jest transpilation from the TypeScript compiler), then migrate TypeScript on `modernization-p0`, regenerate the lockfile, and run the complete tests/lint/Firefox+Chromium build/package matrix. Do not use `--force` or `--legacy-peer-deps` as the migration solution."""
          if old not in text:
              raise SystemExit('expected TypeScript 7 roadmap block not found')
          text = text.replace(old, new, 1)

          old_blocker = "TypeScript 7 cannot be treated as a safe one-line dependency bump: the concrete current blocker is the `ts-jest@26.5.6` peer range (`typescript >=3.8 <5.0`). The Jest/ts-jest test toolchain and lockfile therefore require a coordinated migration on `modernization-p0` before TypeScript 7 can be validated."
          new_blocker = "TypeScript 7 cannot be treated as a safe one-line dependency bump. The repository currently uses `ts-jest@26.5.6` (`typescript >=3.8 <5.0`), and even current upstream `ts-jest` 29.4.12 still declares `typescript >=4.3 <7`; therefore the TypeScript 7 migration requires replacing or decoupling the Jest TypeScript transform rather than only upgrading `ts-jest`."
          if old_blocker not in text:
              raise SystemExit('expected TypeScript 7 blocker text not found')
          text = text.replace(old_blocker, new_blocker, 1)

          old_status = "The TypeScript 7 gate is now diagnosed precisely: the existing Jest 26-era `ts-jest@26.5.6` peer constraint blocks installation and must be migrated coherently rather than bypassed."
          new_status = "The TypeScript 7 gate is now diagnosed through the current upstream ecosystem: upgrading to current `ts-jest` alone is insufficient because `ts-jest` 29.4.12 still excludes TypeScript 7, so the remaining work is to replace/decouple the Jest TypeScript transform and then validate the full TypeScript 7 toolchain."
          if old_status not in text:
              raise SystemExit('expected completion-status text not found')
          text = text.replace(old_status, new_status, 1)

          path.write_text(text)
      - name: Commit roadmap update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: record TypeScript 7 transformer gate"
          git push origin HEAD:modernization-p0
