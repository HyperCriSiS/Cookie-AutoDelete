name: Capture current test diagnostics

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/current-test-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernization-p0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture tests
        shell: bash
        run: |
          set +e
          npm test -- --runInBand > current-test-diagnostics.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> current-test-diagnostics.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current-test-diagnostics.txt
          git commit -m "chore: capture current test diagnostics"
          git push origin HEAD:modernization-p0