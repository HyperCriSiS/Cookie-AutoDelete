name: get-build-command

on:
  repository_dispatch:
    types: [get-build-command]

concurrency:
  group: get-build-${{ github.event.client_payload.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  getBuild:
    name: Get Build for PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find stable artifact links
        id: arts
        env:
          GH_RUNID: ${{ github.event.client_payload.slash_command.args.unnamed.arg1 }}
          GH_BRANCH: ${{ github.event.client_payload.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail

          gh run list \
            --repo "$GH_REPO" \
            --branch "$GH_BRANCH" \
            --workflow "CI" \
            --limit 100 \
            --json 'databaseId,event,status,conclusion,headSha' \
            --jq '[.[] | select(.event == "pull_request") | select(.status == "completed") | select(.conclusion == "success")]' \
            > gh_run_list.json

          mapfile -t RUNS < <(jq -r '.[].databaseId' gh_run_list.json)

          if [[ -n "$GH_RUNID" ]] && [[ ! " ${RUNS[*]} " =~ " ${GH_RUNID} " ]]; then
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
            echo "message=Run ID **$GH_RUNID** was not found in the successful CI runs for branch **$GH_BRANCH**." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$GH_RUNID" ]]; then
            for run_id in "${RUNS[@]}"; do
              artifacts_json=$(gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/$GH_REPO/actions/runs/$run_id/artifacts")
              build_count=$(jq '[.artifacts[] | select(.name | startswith("Cookie-AutoDelete")) | select(.expired == false)] | length' <<< "$artifacts_json")
              if (( build_count > 0 )); then
                GH_RUNID=$run_id
                printf '%s' "$artifacts_json" > artifacts.json
                break
              fi
            done
          fi

          if [[ -z "$GH_RUNID" ]]; then
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
            echo "message=Could not find a successful CI run with unexpired browser build artifacts." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! -f artifacts.json ]]; then
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GH_REPO/actions/runs/$GH_RUNID/artifacts" \
              > artifacts.json
          fi

          build_count=$(jq '[.artifacts[] | select(.name | startswith("Cookie-AutoDelete")) | select(.expired == false)] | length' artifacts.json)
          if (( build_count == 0 )); then
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
            echo "message=No unexpired browser build artifacts were found for run **$GH_RUNID**." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEADSHA=$(jq -r ".[] | select(.databaseId == $GH_RUNID) | .headSha" gh_run_list.json)
          {
            echo "result=SUCCESS"
            echo "runid=$GH_RUNID"
            echo "runsha=$HEADSHA"
            echo 'links<<EOF'
            jq -r \
              --arg server "$GH_SERVER" \
              --arg repo "$GH_REPO" \
              --arg run "$GH_RUNID" \
              '.artifacts[]
                | select(.name | startswith("Cookie-AutoDelete"))
                | select(.expired == false)
                | "- [\(.name)](\($server)/\($repo)/actions/runs/\($run)/artifacts/\(.id)) — available until \(.expires_at // "artifact retention expiry")"' \
              artifacts.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: React to slash command
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
          reactions: hooray

      - name: Reply with error
        if: steps.arts.outputs.result == 'FAILED'
        uses: peter-evans/create-or-update-comment@v5
        with:
          repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
          issue-number: ${{ github.event.client_payload.github.payload.issue.number }}
          body: |
            @${{ github.event.client_payload.github.actor }}

            I could not fetch a build for `/${{ github.event.client_payload.slash_command.command }} ${{ github.event.client_payload.slash_command.arg1 }}`.

            ${{ steps.arts.outputs.message }}
          reactions: confused

      - name: Reply with stable build links
        if: steps.arts.outputs.result == 'SUCCESS'
        uses: peter-evans/create-or-update-comment@v5
        with:
          repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
          issue-number: ${{ github.event.client_payload.github.payload.issue.number }}
          body: |
            @${{ github.event.client_payload.github.actor }}

            ## Build ${{ steps.arts.outputs.runid }} — commit `${{ steps.arts.outputs.runsha }}`

            ${{ steps.arts.outputs.links }}

            These are stable GitHub artifact links. You must be signed into GitHub, and the links remain usable until the artifacts expire according to repository retention.
          reactions: hooray
