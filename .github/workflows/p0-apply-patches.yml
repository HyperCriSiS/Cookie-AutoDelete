name: P0 Apply Patches

on:
  push:
    branches:
      - modernization-p0

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: apply remaining P0 compatibility patches'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: modernization-p0
          fetch-depth: 0
      - name: Apply asserted compatibility patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} exact match(es), found {actual}')
              p.write_text(text.replace(old, new, count))

          replace_exact(
              'src/services/ContextMenuEvents.ts',
              'browser.runtime.getManifest().manifest_version === 3',
              'Number(browser.runtime.getManifest().manifest_version) === 3',
          )

          replace_exact(
              'src/typings/Webext.d.ts',
              """declare namespace browser.runtime {
            type CompatibleManifest = Omit<Manifest, 'manifest_version'> & {
              manifest_version: 2 | 3;
            };
            function getManifest(): CompatibleManifest;
          }

          """,
              '',
          )

          replace_exact(
              '__tests__/services/CleanupService.spec.ts',
              """const sampleTab: browser.tabs.Tab = {
            active: true,
            cookieStoreId: 'firefox-default',""",
              """const sampleTab: browser.tabs.Tab = {
            active: true,
            id: 1,
            cookieStoreId: 'firefox-default',""",
          )

          replace_exact(
              '__tests__/services/CleanupService.spec.ts',
              """    it('should return true because of restart cleanup and is expired cookie on restart.  Edge case => usually notInAnyList takes precidence already.', () => {
                const cleanReasonObj: CleanReasonObject = {
                  cached: false,
                  cleanCookie: true,
                  cookie: {
                    ...restartCleanCookie,
                  },
                  openTabStatus: OpenTabStatus.TabsWasNotIgnored,
                  reason: ReasonClean.ExpiredCookieRestart,
                };
                const result = filterSiteData(cleanReasonObj, SiteDataType.LOCALSTORAGE);
                expect(result).toBe(true);
              });""",
              """    it('should not misclassify an expired restart cookie without a matching expression as CAD site data', () => {
                const cleanReasonObj: CleanReasonObject = {
                  cached: false,
                  cleanCookie: true,
                  cookie: {
                    ...restartCleanCookie,
                  },
                  openTabStatus: OpenTabStatus.TabsWasNotIgnored,
                  reason: ReasonClean.ExpiredCookieRestart,
                };
                const result = filterSiteData(cleanReasonObj, SiteDataType.LOCALSTORAGE);
                expect(result).toBe(false);
              });""",
          )

          replace_exact(
              '__tests__/services/CleanupService.spec.ts',
              """      it('should call cleanSiteData for: Chrome, pluginDataCleanup true', async () => {
                await otherBrowsingDataCleanup(
                  {
                    ...pluginDataState,
                    cache: {
                      browserDetect: browserName.Chrome,
                    },
                  },
                  [],
                );
                expect(spyCleanupService.cleanSiteData).toHaveBeenCalledTimes(1);
              });""",
              """      it('should not call cleanSiteData for deprecated Chromium pluginData cleanup', async () => {
                await otherBrowsingDataCleanup(
                  {
                    ...pluginDataState,
                    cache: {
                      browserDetect: browserName.Chrome,
                    },
                  },
                  [],
                );
                expect(spyCleanupService.cleanSiteData).not.toHaveBeenCalled();
              });""",
          )
          PY

          git diff --check
          git diff -- src/services/ContextMenuEvents.ts src/typings/Webext.d.ts __tests__/services/CleanupService.spec.ts
      - name: Commit exact patch set
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/ContextMenuEvents.ts src/typings/Webext.d.ts __tests__/services/CleanupService.spec.ts
          git commit -m 'test: align legacy suite with MV3 behavior'
          git push origin HEAD:modernization-p0
