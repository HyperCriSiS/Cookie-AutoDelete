name: automation record legacy profile coverage
on:
  push:
    branches: [modernization-p0]
    paths:
      - '.github/workflows/automation-inspect-phase2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update roadmap from verified tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          s = p.read_text()
          anchor = "- [ ] Validate upgrades from existing Cookie AutoDelete user profiles/settings on Firefox and Chromium without destructive resets.\n"
          additions = (
              "- [x] Validate Firefox legacy-profile activation when a later-introduced `CLEANUP_CACHE` setting is absent: activation remains non-destructive and does not trigger browsing-data cleanup (`65bac073`); focused `SettingService` validation and normal CI were green.\n"
              "- [x] Validate the equivalent Chromium legacy-profile activation path without destructive cleanup (`9a82906b`); focused `SettingService` validation and normal push/PR/PR-target CI were green.\n"
          )
          if additions.splitlines()[0] not in s:
              if anchor not in s:
                  raise SystemExit('phase-2 upgrade anchor not found')
              s = s.replace(anchor, additions + anchor)
          old = "**Not fully completed.** Phase 1 functional stabilization is complete. Phase 2 now covers two concrete legacy-profile missing-setting cases; the next priority remains broader non-destructive Firefox/Chromium profile-upgrade validation, then runtime behavior and state-restoration compatibility."
          new = "**Not fully completed.** Phase 1 functional stabilization is complete. Phase 2 now covers missing-setting upgrade safety plus explicit non-destructive legacy-profile activation on both Firefox and Chromium. Broader profile/settings migration coverage remains open, followed by runtime behavior and state-restoration compatibility."
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          git config user.name HyperCriSiS
          git config user.email dev.github@w3b.world
          git add ROADMAP.md
          git commit -m 'docs: record Firefox and Chromium upgrade coverage'
          git push
