name: Align cleanup success test mock

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/repair-cleanup-success-mock.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernization-p0
      - name: Add explicit successful cookie removal mock
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('__tests__/services/CleanupService.spec.ts')
          text = path.read_text()
          old = "      it('Regular clean, exclude open tabs.', async () => {\n        const ffResult = await cleanCookiesOperation("
          new = "      it('Regular clean, exclude open tabs.', async () => {\n        when(global.browser.cookies.remove)\n          .calledWith(expect.any(Object))\n          .mockResolvedValue({} as never);\n        const ffResult = await cleanCookiesOperation("
          if old not in text:
              raise SystemExit('target test context not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __tests__/services/CleanupService.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: mock confirmed cookie removals"
          git push origin HEAD:modernization-p0