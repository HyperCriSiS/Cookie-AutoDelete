name: Temporary security dependency update

on:
  push:
    branches:
      - modernization-p0

permissions:
  contents: write

jobs:
  update-dependencies:
    if: >-
      github.event.head_commit.message == 'chore: generate remaining security dependency updates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Upgrade copy-webpack-plugin to v14
        run: npx --yes npm@8.19.4 install --save-dev 'copy-webpack-plugin@^14.0.0' --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refresh targeted transitive security dependencies
        run: npx --yes npm@8.19.4 update json5 @babel/runtime @babel/traverse braces flatted lodash serialize-javascript ws tough-cookie form-data minimatch js-yaml --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package metadata changes generated."
            exit 0
          fi
          git commit -m "chore: update remaining security dependencies"
          git push
