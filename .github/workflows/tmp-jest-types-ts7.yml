name: Temporary Jest type declaration modernization

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/tmp-jest-types-ts7.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install baseline dependencies
        run: npm ci --prefer-offline --no-fund
      - name: Probe latest Jest type declarations
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev @types/jest@latest @types/jest-when@latest
          {
            echo '## Dependency versions'
            npm ls @types/jest @types/jest-when jest ts-jest typescript || true
            echo
            echo '## Repository TypeScript diagnostics'
            set +e
            npx tsc --noEmit --pretty false
            status=$?
            set -e
            echo
            echo "tsc_exit_code=$status"
          } > .github/tmp-jest-types-diagnostics.txt 2>&1
      - name: Commit diagnostic record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add .github/tmp-jest-types-diagnostics.txt
          git commit -m 'chore: record Jest type modernization diagnostics'
          git push
