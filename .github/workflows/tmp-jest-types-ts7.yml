name: Temporary Jest type declaration modernization

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/tmp-jest-types-ts7.yml

permissions:
  contents: write

jobs:
  diagnose-ts7:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install baseline dependencies
        run: npm ci --prefer-offline --no-fund
      - name: Apply Jest declaration modernization candidate
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev @types/jest@latest @types/jest-when@latest
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('__tests__').rglob('*.ts'):
              text = p.read_text()
              text = text.replace('.toBeCalledTimes(', '.toHaveBeenCalledTimes(')
              text = text.replace('.toThrowError(', '.toThrow(')
              p.write_text(text)
          PY
      - name: Capture TypeScript 7 diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tsconfig.json')
          text = p.read_text()
          old_module = '    "module": "commonjs" /* Specify module code generation:'
          old_resolution = '    "moduleResolution": "node" /* Specify module resolution strategy:'
          module_line = next(line for line in text.splitlines(True) if old_module in line)
          resolution_line = next(line for line in text.splitlines(True) if old_resolution in line)
          text = text.replace(module_line, '    "module": "Node16",\n', 1)
          text = text.replace(resolution_line, '    "moduleResolution": "Node16",\n', 1)
          p.write_text(text)
          PY
          npm install --no-save --package-lock=false --legacy-peer-deps typescript@7.0.2
          {
            echo '## Versions'
            npx tsc --version
            npm ls @types/jest @types/jest-when jest ts-jest typescript || true
            echo
            echo '## TS7 diagnostics'
            set +e
            npx tsc --noEmit --pretty false
            status=$?
            set -e
            echo
            echo "tsc_exit_code=$status"
          } > .github/tmp-ts7-jest-diagnostics.txt 2>&1
      - name: Commit TS7 diagnostic record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add .github/tmp-ts7-jest-diagnostics.txt
          git commit -m 'chore: record TS7 Jest declaration diagnostics'
          git push
