name: Temporary Jest type declaration modernization

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/tmp-jest-types-ts7.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install baseline dependencies
        run: npm ci --prefer-offline --no-fund
      - name: Apply Jest declaration modernization
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact @types/jest@30.0.0 @types/jest-when@3.5.5
          python3 - <<'PY'
          from pathlib import Path
          changed = []
          for p in Path('__tests__').rglob('*.ts'):
              text = p.read_text()
              new = text.replace('.toBeCalledTimes(', '.toHaveBeenCalledTimes(').replace('.toThrowError(', '.toThrow(')
              if new != text:
                  p.write_text(new)
                  changed.append(str(p))
          if not changed:
              raise SystemExit('Expected obsolete Jest aliases were not found')
          print('\n'.join(changed))
          PY
          npm ls @types/jest @types/jest-when jest ts-jest typescript
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test -- --runInBand
      - name: Lint
        run: npm run lint
      - name: Build Firefox
        run: npm run build
        env:
          BROWSER: firefox
      - name: Build Chromium
        run: npm run build
        env:
          BROWSER: chromium
      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/tmp-jest-types-diagnostics.txt .github/tmp-ts7-jest-diagnostics.txt
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add -A package.json package-lock.json __tests__ .github/tmp-jest-types-diagnostics.txt .github/tmp-ts7-jest-diagnostics.txt
          git status --short
          git commit -m 'chore: modernize Jest type declarations'
          git push
