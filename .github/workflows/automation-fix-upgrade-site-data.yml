name: automation fix missing site-data upgrade

on:
  push:
    branches: [modernization-p0]
    paths: ['.github/workflows/automation-fix-upgrade-site-data.yml']

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernization-p0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply narrow regression fix and test
        run: |
          python - <<'PY'
          from pathlib import Path
          service = Path('src/services/SettingService.ts')
          text = service.read_text()
          old = """      if (
        (previous[sd] === undefined || !previous[sd].value) &&
        SettingService.current[sd].value
      ) {"""
          new = """      const currentSiteDataSetting = SettingService.current[sd];
      if (
        currentSiteDataSetting !== undefined &&
        (previous[sd] === undefined || !previous[sd].value) &&
        currentSiteDataSetting.value
      ) {"""
          if old not in text:
              raise SystemExit('SettingService target block not found')
          service.write_text(text.replace(old, new, 1))

          spec = Path('__tests__/services/SettingService.spec.ts')
          text = spec.read_text()
          anchor = """    it('should tolerate settings introduced after an older profile was persisted', async () => {
      SettingService.init();
      const previous = { ...TestSettingService.getTestCurrent() };
      delete previous[SettingID.ACTIVE_MODE];
      TestSettingService.setTestCurrent(previous);

      TestStore.changeSetting(SettingID.ACTIVE_MODE, true);

      await expect(SettingService.onSettingsChange()).resolves.toBeUndefined();
    });
"""
          addition = anchor + """
    it('should tolerate an older profile while a site-data cleanup setting is still missing', async () => {
      const legacySettings = { ...initialState.settings };
      delete legacySettings[SettingID.CLEANUP_CACHE];
      const legacyStore: Store<State, ReduxAction> = createStore({
        ...initialState,
        settings: legacySettings,
      });
      StoreUser.init(legacyStore);
      SettingService.init();

      legacyStore.dispatch(updateSetting({ name: SettingID.ACTIVE_MODE, value: true }));

      await expect(SettingService.onSettingsChange()).resolves.toBeUndefined();
      expect(global.browser.browsingData.remove).not.toHaveBeenCalled();

      StoreUser.init(store);
      SettingService.init();
    });
"""
          if anchor not in text:
              raise SystemExit('SettingService.spec anchor not found')
          spec.write_text(text.replace(anchor, addition, 1))
          PY
          npm ci
          npm test -- --runInBand __tests__/services/SettingService.spec.ts
      - name: Commit validated fix
        run: |
          git config user.name "HyperCriSiS"
          git config user.email "dev.github@w3b.world"
          git add src/services/SettingService.ts __tests__/services/SettingService.spec.ts
          git commit -m "fix: tolerate missing site-data settings during upgrades"
          git push origin HEAD:modernization-p0
