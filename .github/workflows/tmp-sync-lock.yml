name: Temporary package lock metadata sync

on:
  push:
    branches:
      - modernization-p0
    paths:
      - package.json
      - .github/workflows/tmp-sync-lock.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: modernization-p0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Synchronize package-lock metadata
        run: npx --yes npm@8.19.4 install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lock metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git commit -m 'chore: sync package lock metadata'
          git push origin HEAD:modernization-p0
