name: tmp-correct-missing-setting-semantics

on:
  push:
    branches: [modernization-p0]
    paths:
      - '.github/workflows/tmp-correct-missing-setting-semantics.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernization-p0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Correct missing-setting semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/SettingService.ts')
          s = p.read_text()
          old = "return previous !== undefined && current !== undefined && previous.value !== current.value;"
          new = "return current !== undefined && (previous === undefined || previous.value !== current.value);"
          if old not in s:
              raise SystemExit('expected hasNewValue implementation not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run SettingService regression
        run: npx jest __tests__/services/SettingService.spec.ts --runInBand
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/SettingService.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: treat newly introduced settings as changed'
          git push origin HEAD:modernization-p0
