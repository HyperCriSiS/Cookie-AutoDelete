name: automation inspect legacy upgrade test coverage
on:
  push:
    branches: [modernization-p0]
    paths: ['.github/workflows/automation-inspect-upgrade-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect upgrade coverage
        run: |
          echo '=== SettingService tests ==='
          sed -n '1,320p' __tests__/services/SettingService.spec.ts
          echo '=== StateHydration tests ==='
          sed -n '1,360p' __tests__/services/StateHydration.spec.ts
          echo '=== settings initialization references ==='
          grep -R -n -E 'hydrate|validateSettings|onSettingsChange|browserType|firefox|chromium|legacy' src __tests__ --include='*.ts' --include='*.js' | head -n 260 || true
