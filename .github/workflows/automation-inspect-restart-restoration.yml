name: automation inspect restart restoration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual background hydration/startup path
        run: |
          echo '=== background initialization ==='
          sed -n '1,125p' src/background.ts
          echo '=== background startup ==='
          sed -n '285,355p' src/background.ts
          echo '=== test browser bootstrap patterns ==='
          grep -R -n -E 'background|onStartup|onInstalled|runtime\.onStartup|StateHydration' __tests__ | head -n 260 || true
          echo '=== jest setup ==='
          find . -maxdepth 3 -type f | grep -E '(setup|jest).*\.(ts|js)$' | sort | head -n 40
