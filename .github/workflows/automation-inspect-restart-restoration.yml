name: automation inspect restart restoration
on:
  push:
    branches: [modernization-p0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect restart/persistence coverage
        run: |
          echo '=== StateRestart.spec.ts ==='
          cat __tests__/services/StateRestart.spec.ts
          echo '=== StatePersistence candidates ==='
          find src -type f | grep -E 'State(Persistence|Hydration)|StoreBridge|background|index' | sort
          echo '=== restoration hooks ==='
          grep -R -n -E 'hydrate|restore|storage\.local|onStartup|onInstalled|service.?worker' src | head -n 260 || true
