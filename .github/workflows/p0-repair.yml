name: P0 Repair

on:
  push:
    branches:
      - p0-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: p0-repair
          fetch-depth: 0

      - name: Apply exact test repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('__tests__/services/CleanupService.spec.ts')
          text = path.read_text()

          broken = """          [],
        expect(spyCleanupService.cleanSiteData).not.toHaveBeenCalled();edTimes(1);"""
          fixed = """          [],
        );
        expect(spyCleanupService.cleanSiteData).not.toHaveBeenCalled();"""
          if text.count(broken) != 1:
              raise SystemExit('Malformed pluginData block mismatch')
          text = text.replace(broken, fixed, 1)

          marker = """  describe('cleanCookiesOperation()', () => {
    const cleanupProperties: CleanupProperties = {
      greyCleanup: false,
      ignoreOpenTabs: false,
    };
    beforeEach(() => {
      when(global.browser.tabs.query)"""
          replacement = """  describe('cleanCookiesOperation()', () => {
    const cleanupProperties: CleanupProperties = {
      greyCleanup: false,
      ignoreOpenTabs: false,
    };
    beforeEach(() => {
      when(global.browser.cookies.remove)
        .calledWith(expect.any(Object))
        .mockResolvedValue({} as never);
      when(global.browser.tabs.query)"""
          if text.count(marker) != 1:
              raise SystemExit('cleanCookiesOperation setup mismatch')
          path.write_text(text.replace(marker, replacement, 1))
          PY

          git diff --check
          git diff -- __tests__/services/CleanupService.spec.ts

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add __tests__/services/CleanupService.spec.ts
          git commit -m 'test: finalize cleanup P0 regressions'
          git push origin HEAD:p0-repair
