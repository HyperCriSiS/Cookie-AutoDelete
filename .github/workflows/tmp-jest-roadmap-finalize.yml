name: Temporary Jest roadmap finalization

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/tmp-jest-roadmap-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Update roadmap and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          text = p.read_text()
          old = "  - [ ] Modernize the Jest/type declarations needed for TS7 rather than relying on the Jest-26-era `NodeJS.Global` typings exposed by the isolated probe."
          new = "  - [x] Modernize Jest/type declarations for the TS7 path: `@types/jest@30.0.0` and `@types/jest-when@3.5.5` are pinned, removed matcher aliases were migrated (`toHaveBeenCalledTimes`, `toThrow`), and repository typecheck, full Jest suite, lint, Firefox build, and Chromium build passed in validation run 32164303469. The isolated TS7 diagnostic no longer reports Jest declaration errors; remaining TS7 diagnostics belong to the separately tracked WebExtension/module-resolution and transform migration."
          if old not in text:
              raise SystemExit('Expected open Jest roadmap item not found')
          text = text.replace(old, new, 1)
          old_blocker = "Jest-26-era declaration modernization and the ambient `declare const enum`/Jest-transform dependency remain open engineering work."
          if old_blocker in text:
              text = text.replace(old_blocker, "Jest/type declarations are now modernized; the ambient `declare const enum`/Jest-transform dependency remains open engineering work.", 1)
          old_completion = "The next TypeScript/toolchain step is Jest/type-declaration modernization, followed by the ambient const-enum/Jest-transform dependency and any stricter application errors exposed after those migrations."
          if old_completion in text:
              text = text.replace(old_completion, "The next TypeScript/toolchain step is the ambient const-enum/Jest-transform dependency, followed by any stricter application errors exposed after that migration.", 1)
          p.write_text(text)
          PY
          git rm -f .github/workflows/tmp-jest-types-ts7.yml .github/workflows/tmp-jest-roadmap-finalize.yml
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add ROADMAP.md
          git status --short
          git commit -m 'docs: complete Jest declaration modernization'
          git push
