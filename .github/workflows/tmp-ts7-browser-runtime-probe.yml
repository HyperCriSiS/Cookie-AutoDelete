name: Temporary TS7 browser runtime typing probe

on:
  push:
    branches: [modernization-p0]
    paths: ['.github/workflows/tmp-ts7-browser-runtime-probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --legacy-peer-deps typescript@7.0.2 @types/webextension-polyfill
      - name: Capture candidate diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .tmp-ts7-probe
          probe() {
            label="$1"
            declaration="$2"
            printf '%s\n' "$declaration" > src/typings/BrowserRuntime.d.ts
            npx tsc --noEmit --module esnext --moduleResolution bundler --skipLibCheck true > ".tmp-ts7-probe/${label}.log" 2>&1 || true
            rm -f src/typings/BrowserRuntime.d.ts
          }
          probe "typeof-import" $'type CadBrowserRuntime = typeof import("webextension-polyfill");\ndeclare const browser: CadBrowserRuntime;'
          probe "default-import" $'import browserPolyfill from "webextension-polyfill";\ndeclare global { const browser: typeof browserPolyfill; }\nexport {};'
          probe "import-equals" $'import browserPolyfill = require("webextension-polyfill");\ndeclare global { const browser: typeof browserPolyfill; }\nexport {};'
          for f in .tmp-ts7-probe/*.log; do
            sed -n '1,120p' "$f" > "$f.trim" && mv "$f.trim" "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-ts7-probe
          git commit -m "chore: capture TS7 browser bridge probe diagnostics"
          git push origin HEAD:modernization-p0
