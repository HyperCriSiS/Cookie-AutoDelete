name: Temporary TS7 browser runtime typing probe

on:
  push:
    branches: [modernization-p0]
    paths: ['.github/workflows/tmp-ts7-browser-runtime-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        candidate: [typeof-import, default-import, import-equals]
    name: probe-${{ matrix.candidate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --legacy-peer-deps typescript@7.0.2 @types/webextension-polyfill
      - name: Write candidate declaration
        shell: bash
        run: |
          case "${{ matrix.candidate }}" in
            typeof-import)
              cat > src/typings/BrowserRuntime.d.ts <<'EOF'
          type CadBrowserRuntime = typeof import("webextension-polyfill");
          declare const browser: CadBrowserRuntime;
          EOF
              ;;
            default-import)
              cat > src/typings/BrowserRuntime.d.ts <<'EOF'
          import browserPolyfill from "webextension-polyfill";
          declare global { const browser: typeof browserPolyfill; }
          export {};
          EOF
              ;;
            import-equals)
              cat > src/typings/BrowserRuntime.d.ts <<'EOF'
          import browserPolyfill = require("webextension-polyfill");
          declare global { const browser: typeof browserPolyfill; }
          export {};
          EOF
              ;;
          esac
      - name: TypeScript 7 compile
        run: npx tsc --noEmit --module esnext --moduleResolution bundler --skipLibCheck true
