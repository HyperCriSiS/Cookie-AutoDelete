name: Temporary roadmap finalization

on:
  push:
    branches:
      - modernization-p0
    paths:
      - '.github/workflows/tmp-cad-cookie-typing.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modernization branch
        uses: actions/checkout@v4
        with:
          ref: modernization-p0
          fetch-depth: 0

      - name: Update roadmap with verified probe result
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          text = p.read_text()
          old = '    - [ ] Retype CAD-internal cookie paths and representative fixtures to the project cross-browser cookie shape so Chromium cookies may omit `firstPartyDomain`; then rerun webpack/tests before committing the dependency swap.\n'
          new = '    - [x] Retype CAD-internal cookie paths and representative fixtures to the project cross-browser cookie shape so Chromium cookies may omit `firstPartyDomain`; the `CadCookie` migration was committed as `ca5a829e` after tests, lint and webpack build passed.\n    - [x] Re-run the maintained `@types/firefox-webext-browser@143.0.0` probe after the `CadCookie` migration and confirm that the previous cookie/`firstPartyDomain` diagnostics are gone.\n    - [ ] Complete the maintained-typing dependency swap after adapting the remaining non-cookie compatibility gaps exposed by that probe: `ContextualIdentity` test fixtures now require `iconUrl`/`colorCode`, the settings active-tab lookup must handle an empty `tabs.query()` result, and legacy third-party declaration checks must be isolated without masking application errors; then run typecheck, tests, lint and webpack before committing the swap.\n'
          if old not in text:
              raise SystemExit('roadmap cookie subtask not found')
          text = text.replace(old, new, 1)
          old = '- TypeScript 7 is no longer blocked by npm peer resolution, the removed legacy module-resolution setting, or lack of a maintained WebExtension typing base. `@types/firefox-webext-browser` reaches whole-program compilation once the legacy WebExtension declarations are removed, but requires a narrow Cookie AutoDelete compatibility augmentation for several legacy type names/shapes. The separate React-Redux/Redux generic-constraint errors, Jest-26-era declaration incompatibilities and ambient `declare const enum`/Jest-transform dependency remain open engineering work.\n'
          new = '- TypeScript 7 is no longer blocked by npm peer resolution, the removed legacy module-resolution setting, or lack of a maintained WebExtension typing base. The CAD-local `CadCookie` shape is now implemented and a repeat probe with `@types/firefox-webext-browser@143.0.0` confirms that the former cookie/`firstPartyDomain` diagnostics are eliminated. The maintained-typing dependency swap still needs the small `ContextualIdentity` fixture and `tabs.query()` nullability adaptations plus a deliberate declaration-check policy for legacy third-party types. The separate React-Redux/Redux generic-constraint errors, Jest-26-era declaration incompatibilities and ambient `declare const enum`/Jest-transform dependency remain open engineering work.\n'
          if old not in text:
              raise SystemExit('roadmap blocker paragraph not found')
          text = text.replace(old, new, 1)
          old = '**Not fully completed.** Manifest V3 foundations, functional CI stabilization, Archiver 8 / Redux 5 modernization and the automated migration/runtime compatibility pass are complete. TypeScript 7 now has a verified WebExtension typing direction: use `@types/firefox-webext-browser` as the maintained base and add only the narrow compatibility layer required by Cookie AutoDelete, then resolve the React-Redux/Redux mismatch, Jest/type-declaration modernization, ambient const-enum/Jest-transform dependency and remaining stricter application errors. Real historical-profile upgrade validation and packaged-browser release-candidate checks remain open.\n'
          new = '**Not fully completed.** Manifest V3 foundations, functional CI stabilization, Archiver 8 / Redux 5 modernization and the automated migration/runtime compatibility pass are complete. The CAD cross-browser cookie retyping is complete and its repeat maintained-Firefox-typing probe no longer reports cookie/`firstPartyDomain` errors. The next TypeScript/toolchain step is to finish the `web-ext-types` → `@types/firefox-webext-browser` dependency swap by resolving the remaining small non-cookie compatibility gaps, then continue with the React-Redux/Redux mismatch, Jest/type-declaration modernization, ambient const-enum/Jest-transform dependency and remaining stricter application errors. Real historical-profile upgrade validation and packaged-browser release-candidate checks remain open.\n'
          if old not in text:
              raise SystemExit('roadmap completion paragraph not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit roadmap and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git rm .github/workflows/tmp-cad-cookie-typing.yml
          git diff --cached --check
          git commit -m 'docs: record maintained WebExtension typing probe'
          git push origin HEAD:modernization-p0
