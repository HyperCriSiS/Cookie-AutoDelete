name: Temporary maintained WebExtension typing probe

on:
  push:
    branches:
      - modernization-p0
    paths:
      - '.github/workflows/tmp-cad-cookie-typing.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modernization branch
        uses: actions/checkout@v4
        with:
          ref: modernization-p0

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install locked baseline
        run: npm ci --prefer-offline --no-fund

      - name: Replace legacy WebExtension types in workspace
        shell: bash
        run: |
          npm uninstall --save-dev web-ext-types
          npm install --save-dev @types/firefox-webext-browser@143.0.0

          python <<'PY'
          from pathlib import Path

          tsconfig = Path('tsconfig.json')
          text = tsconfig.read_text()
          old = '''    "typeRoots": [\n      "node_modules/@types",\n      "node_modules/web-ext-types",\n      "src/typings"\n    ] /* List of folders to include type definitions from. */,\n'''
          if text.count(old) != 1:
              raise SystemExit('Expected legacy typeRoots block exactly once')
          tsconfig.write_text(text.replace(old, '', 1))
          PY

          cat > src/typings/Webext.d.ts <<'EOF'
          /* eslint-disable @typescript-eslint/no-unused-vars */
          /**
           * Cross-browser compatibility additions on top of
           * @types/firefox-webext-browser.
           */

          interface EvListener<T extends (...args: any[]) => any> {
            addListener(callback: T): void;
            removeListener(callback: T): void;
            hasListener(callback: T): boolean;
          }

          declare namespace browser.cookies {
            type CookiePartitionKey = PartitionKey;
          }

          /**
           * Cross-browser cookie shape used inside CAD. Firefox exposes
           * `firstPartyDomain`, while Chromium cookies may omit it entirely.
           */
          type CadCookie = Omit<
            browser.cookies.Cookie,
            'firstPartyDomain' | 'partitionKey'
          > & {
            firstPartyDomain?: string;
            partitionKey?: browser.cookies.CookiePartitionKey;
          };

          declare namespace browser.contextualIdentities {
            type contextualIdentitiesChangeInfo = {
              contextualIdentity: ContextualIdentity;
            };
          }

          declare namespace browser.tabs {
            interface Tab {
              selected?: boolean;
            }

            interface TabChangeInfo extends _OnUpdatedChangeInfo {
              cookieChanged?: {
                removed: boolean;
                cookie: CadCookie;
                cause: browser.cookies.OnChangedCause;
              };
            }
          }
          EOF

          git diff --check
          echo '=== dependency diff ==='
          git diff -- package.json tsconfig.json src/typings/Webext.d.ts
          echo '=== installed typing base ==='
          npm ls @types/firefox-webext-browser web-ext-types || true

      - name: Typecheck maintained typing candidate
        shell: bash
        run: |
          npx tsc --noEmit --pretty false 2>&1 | tee /tmp/maintained-types.log
          if grep -E 'firstPartyDomain|CookieProperties|CookiePartitionKey|CadCookie' /tmp/maintained-types.log; then
            echo 'Unexpected cookie typing diagnostics remain.' >&2
            exit 1
          fi

      - name: Run tests
        run: npm run test -- --verbose

      - name: Run lint
        run: npm run lint

      - name: Run webpack build
        run: npm run build
