name: Temporary maintained WebExtension typing migration

on:
  push:
    branches:
      - modernization-p0
    paths:
      - '.github/workflows/tmp-cad-cookie-typing.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modernization branch
        uses: actions/checkout@v4
        with:
          ref: modernization-p0
          fetch-depth: 0

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install locked baseline
        run: npm ci --prefer-offline --no-fund

      - name: Apply maintained typing candidate
        shell: bash
        run: |
          npm uninstall --save-dev web-ext-types
          npm install --save-dev @types/firefox-webext-browser@143.0.0

          python3 - <<'PY'
          from pathlib import Path
          import re

          tsconfig = Path('tsconfig.json')
          text = tsconfig.read_text()
          legacy = '    "typeRoots": [\n      "node_modules/@types",\n      "node_modules/web-ext-types",\n      "src/typings"\n    ] /* List of folders to include type definitions from. */,\n'
          if legacy in text:
              text = text.replace(legacy, '', 1)
          if '"skipLibCheck": true' not in text:
              marker = '    "strict": true /* Enable all strict type-checking options. */,\n'
              if marker not in text:
                  raise SystemExit('tsconfig strict marker not found')
              text = text.replace(marker, marker + '    "skipLibCheck": true /* Skip type checking declaration files from legacy dependencies. */,\n', 1)
          tsconfig.write_text(text)

          webext = (
              '/* eslint-disable @typescript-eslint/no-unused-vars */\n'
              '/**\n'
              ' * Cookie AutoDelete compatibility additions on top of\n'
              ' * @types/firefox-webext-browser.\n'
              ' *\n'
              ' * Keep this file intentionally narrow: browser APIs should come from the\n'
              ' * maintained upstream declarations wherever possible.\n'
              ' */\n\n'
              'interface EvListener<T extends (...args: any[]) => any> {\n'
              '  addListener(callback: T): void;\n'
              '  removeListener(callback: T): void;\n'
              '  hasListener(callback: T): boolean;\n'
              '}\n\n'
              'declare namespace browser.cookies {\n'
              '  type CookiePartitionKey = PartitionKey;\n'
              '}\n\n'
              '/**\n'
              ' * Cross-browser cookie shape used inside CAD. Firefox exposes\n'
              ' * `firstPartyDomain`, while Chromium cookies may omit it entirely.\n'
              ' */\n'
              'type CadCookie = Omit<\n'
              '  browser.cookies.Cookie,\n'
              "  'firstPartyDomain' | 'partitionKey'\n"
              '> & {\n'
              '  firstPartyDomain?: string;\n'
              '  partitionKey?: browser.cookies.CookiePartitionKey;\n'
              '};\n\n'
              'declare namespace browser.contextualIdentities {\n'
              '  type contextualIdentitiesChangeInfo = {\n'
              '    contextualIdentity: ContextualIdentity;\n'
              '  };\n'
              '}\n\n'
              'declare namespace browser.tabs {\n'
              '  interface Tab {\n'
              '    /** Legacy alias retained for older Chromium-facing CAD code paths. */\n'
              '    selected?: boolean;\n'
              '  }\n\n'
              '  interface TabChangeInfo extends _OnUpdatedChangeInfo {\n'
              '    cookieChanged?: {\n'
              '      removed: boolean;\n'
              '      cookie: CadCookie;\n'
              '      cause: browser.cookies.OnChangedCause;\n'
              '    };\n'
              '  }\n'
              '}\n'
          )
          Path('src/typings/Webext.d.ts').write_text(webext)

          fixture = Path('__tests__/services/ContextualIdentitiesEvents.spec.ts')
          lines = fixture.read_text().splitlines(keepends=True)
          changed_fixture = False
          for idx, line in enumerate(lines):
              if 'cookieStoreId:' not in line:
                  continue
              start = idx
              while start > 0 and '{' not in lines[start]:
                  start -= 1
              end = idx
              while end < len(lines) and '}' not in lines[end]:
                  end += 1
              block = ''.join(lines[start:end + 1])
              if all(key in block for key in ('cookieStoreId:', 'color:', 'icon:', 'name:')) and 'iconUrl:' not in block and 'colorCode:' not in block:
                  indent = re.match(r'\s*', lines[idx]).group(0)
                  lines[end:end] = [f"{indent}iconUrl: '',\n", f"{indent}colorCode: '',\n"]
                  changed_fixture = True
                  break
          if not changed_fixture:
              raise SystemExit('ContextualIdentity fixture candidate not found')
          fixture.write_text(''.join(lines))

          app = Path('src/ui/settings/App.tsx')
          lines = app.read_text().splitlines(keepends=True)
          query_idx = next((i for i, line in enumerate(lines) if 'browser.tabs.query' in line), None)
          if query_idx is None:
              raise SystemExit('browser.tabs.query call not found in settings App')
          stmt_start = query_idx
          while stmt_start > 0 and not re.search(r'\b(const|let)\b.*\btab\b', lines[stmt_start]):
              stmt_start -= 1
          if not re.search(r'\b(const|let)\b.*\btab\b', lines[stmt_start]):
              raise SystemExit('active tab assignment not found')
          stmt_end = query_idx
          while stmt_end < len(lines) and ';' not in lines[stmt_end]:
              stmt_end += 1
          if stmt_end >= len(lines):
              raise SystemExit('active tab assignment terminator not found')
          following = ''.join(lines[stmt_end + 1:stmt_end + 6])
          if 'if (!tab)' not in following:
              indent = re.match(r'\s*', lines[stmt_start]).group(0)
              guard = [f'{indent}if (!tab) {{\n', f'{indent}  return;\n', f'{indent}}}\n']
              lines[stmt_end + 1:stmt_end + 1] = guard
          app.write_text(''.join(lines))
          PY

          git diff --check
          git diff --stat

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Run tests
        run: npm run test -- --verbose

      - name: Run lint
        run: npm run lint

      - name: Run webpack build
        run: npm run build

      - name: Commit validated maintained typing migration
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json tsconfig.json src/typings/Webext.d.ts src/ui/settings/App.tsx __tests__/services/ContextualIdentitiesEvents.spec.ts
          git diff --cached --check
          git commit -m 'build: replace legacy WebExtension typings'
          git push origin HEAD:modernization-p0
