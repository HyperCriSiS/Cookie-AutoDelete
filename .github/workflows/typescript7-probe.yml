name: TypeScript 7 Toolchain Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Inspect current and candidate peer dependencies
        run: |
          node --version
          npm --version
          echo '--- current declarations ---'
          node -e "const p=require('./package.json'); console.log({typescript:p.devDependencies?.typescript,jest:p.devDependencies?.jest,tsJest:p.devDependencies?.['ts-jest'],typesJest:p.devDependencies?.['@types/jest'],tsLoader:p.devDependencies?.['ts-loader']})"
          echo '--- latest candidate peers ---'
          npm view ts-jest@latest version peerDependencies engines
          npm view jest@latest version engines
          npm view @types/jest@latest version
          npm view ts-loader@latest version peerDependencies engines
          echo '--- TypeScript 7 metadata ---'
          npm view typescript@7.0.2 version engines
