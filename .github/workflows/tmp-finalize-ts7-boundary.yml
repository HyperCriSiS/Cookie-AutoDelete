name: Temporary finalize TypeScript 7 application boundary

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/tmp-finalize-ts7-boundary.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Update roadmap and remove temporary probes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          text = p.read_text()
          old = "  - [ ] Resolve the `react-redux@8.1.3` / `redux@5.0.1` TypeScript-7 declaration incompatibility without unnecessarily changing the React 17 runtime major, then re-run the whole-program compile to isolate real application typing defects."
          new = "  - [x] Resolve the `react-redux@8.1.3` / `redux@5.0.1` TypeScript-7 declaration incompatibility without unnecessarily changing the React 17 runtime major. The refined TS7 boundary probe (`0585c138`, workflow run 32158487771) confirmed that the existing deliberate `skipLibCheck` boundary suppresses only direct third-party declaration incompatibilities while a TypeScript 7.0.2 whole-program compile reports no CAD application/test diagnostics and no remaining TypeScript diagnostics. No React runtime-major upgrade is required for this migration step."
          if text.count(old) != 1:
              raise SystemExit('Expected React-Redux roadmap item exactly once')
          text = text.replace(old, new, 1)
          old_blocker = "The separate React-Redux/Redux generic-constraint errors, Jest-26-era declaration incompatibilities and ambient `declare const enum`/Jest-transform dependency remain open engineering work."
          new_blocker = "The React-Redux/Redux generic-constraint mismatch is now isolated at the third-party declaration boundary and the TS7 whole-program compile is clean. Jest-26-era declaration modernization and the ambient `declare const enum`/Jest-transform dependency remain open engineering work."
          if text.count(old_blocker) != 1:
              raise SystemExit('Expected blocker sentence exactly once')
          text = text.replace(old_blocker, new_blocker, 1)
          old_completion = "The next TypeScript/toolchain step is to resolve the React-Redux/Redux TypeScript-7 declaration mismatch, then continue with Jest/type-declaration modernization, the ambient const-enum/Jest-transform dependency and remaining stricter application errors."
          new_completion = "The React-Redux/Redux TypeScript-7 declaration boundary is now verified clean without a React runtime-major change. The next TypeScript/toolchain step is Jest/type-declaration modernization, followed by the ambient const-enum/Jest-transform dependency and any stricter application errors exposed after those migrations."
          if text.count(old_completion) != 1:
              raise SystemExit('Expected completion sentence exactly once')
          text = text.replace(old_completion, new_completion, 1)
          p.write_text(text)
          PY
          git rm .github/workflows/tmp-ts7-application-boundary.yml
          git rm .github/workflows/tmp-finalize-ts7-boundary.yml
      - name: Commit verified roadmap state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add ROADMAP.md
          git commit -m 'docs: complete TypeScript 7 application boundary'
          git push