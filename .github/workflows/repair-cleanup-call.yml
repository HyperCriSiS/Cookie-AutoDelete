name: Repair incomplete cleanup test call

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/repair-cleanup-call.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernization-p0
      - name: Restore closing call delimiter
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('__tests__/services/CleanupService.spec.ts')
          text = path.read_text()
          broken = "          [],\n        expect(spyCleanupService.cleanSiteData).not.toHaveBeenCalled();"
          fixed = "          [],\n        );\n        expect(spyCleanupService.cleanSiteData).not.toHaveBeenCalled();"
          if broken not in text:
              raise SystemExit('expected incomplete cleanup call not found')
          path.write_text(text.replace(broken, fixed, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __tests__/services/CleanupService.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: restore cleanup call delimiter"
          git push origin HEAD:modernization-p0