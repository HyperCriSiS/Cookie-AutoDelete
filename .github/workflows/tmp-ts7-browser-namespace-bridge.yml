name: Temporary TS7 namespace-preserving browser bridge probe

on:
  push:
    branches: [modernization-p0]
    paths: ['.github/workflows/tmp-ts7-browser-namespace-bridge.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --legacy-peer-deps typescript@7.0.2
      - name: Probe namespace-preserving bridge variants
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .tmp-ts7-namespace-bridge
          cp node_modules/@types/firefox-webext-browser/index.d.ts .tmp-ts7-namespace-bridge/firefox-index.d.ts
          head -n 120 node_modules/@types/firefox-webext-browser/index.d.ts > .tmp-ts7-namespace-bridge/firefox-index-head.txt
          probe() {
            label="$1"
            declaration="$2"
            printf '%s\n' "$declaration" > src/typings/BrowserRuntime.d.ts
            npx tsc --noEmit --module esnext --moduleResolution bundler --skipLibCheck true > ".tmp-ts7-namespace-bridge/${label}.log" 2>&1 || true
            rm -f src/typings/BrowserRuntime.d.ts
          }
          probe "selected-namespaces" $'type CadBrowserRuntime = {\n  tabs: typeof browser.tabs;\n  runtime: typeof browser.runtime;\n  cookies: typeof browser.cookies;\n  storage: typeof browser.storage;\n  browsingData: typeof browser.browsingData;\n  contextualIdentities: typeof browser.contextualIdentities;\n  notifications: typeof browser.notifications;\n  alarms: typeof browser.alarms;\n  commands: typeof browser.commands;\n  management: typeof browser.management;\n  permissions: typeof browser.permissions;\n  windows: typeof browser.windows;\n};\ndeclare const browser: CadBrowserRuntime;'
          probe "global-selected-namespaces" $'type CadBrowserRuntime = {\n  tabs: typeof browser.tabs;\n  runtime: typeof browser.runtime;\n  cookies: typeof browser.cookies;\n  storage: typeof browser.storage;\n  browsingData: typeof browser.browsingData;\n  contextualIdentities: typeof browser.contextualIdentities;\n  notifications: typeof browser.notifications;\n  alarms: typeof browser.alarms;\n  commands: typeof browser.commands;\n  management: typeof browser.management;\n  permissions: typeof browser.permissions;\n  windows: typeof browser.windows;\n};\ndeclare global { const browser: CadBrowserRuntime; }\nexport {};'
          for f in .tmp-ts7-namespace-bridge/*.log; do sed -n '1,160p' "$f" > "$f.trim" && mv "$f.trim" "$f"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-ts7-namespace-bridge
          git commit -m "chore: capture TS7 namespace bridge diagnostics"
          git push origin HEAD:modernization-p0
