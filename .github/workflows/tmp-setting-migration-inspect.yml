name: tmp-setting-migration-inspect
on:
  push:
    branches: [modernization-p0]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect settings migration code
        run: |
          echo '=== SettingService.ts ==='
          sed -n '1,320p' src/services/SettingService.ts
          echo '=== SettingService.spec.ts ==='
          sed -n '1,300p' __tests__/services/SettingService.spec.ts
