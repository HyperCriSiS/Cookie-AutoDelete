name: automation inspect cleanup restart state
on:
  push:
    branches: [modernization-p0]
    paths: ['.github/workflows/automation-inspect-cleanup-restart.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernization-p0
          fetch-depth: 0
      - name: Inspect bootstrap and persisted cleanup-related state
        run: |
          echo '=== StateRestart ==='
          sed -n '1,240p' __tests__/services/StateRestart.spec.ts
          echo '=== Store ==='
          sed -n '1,260p' src/redux/Store.ts
          echo '=== background bootstrap ==='
          sed -n '1,300p' src/background.ts
          echo '=== state-related reducers/services ==='
          grep -R -n -E 'cookieCache|cleanup|openTab|persist|hydrate|parsePersistedState' src/redux src/services src/background.ts --include='*.ts' | head -n 260 || true
      - name: Remove helper
        run: |
          rm .github/workflows/automation-inspect-cleanup-restart.yml
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add .github/workflows/automation-inspect-cleanup-restart.yml
          git commit -m 'ci: remove cleanup restart inspection helper'
          git push origin HEAD:modernization-p0
