name: Temporary Codecov v7 validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 18.x
        uses: actions/setup-node@v7
        with:
          node-version: '18.x'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Generate coverage
        run: npm run test -- --coverage
      - name: Validate Codecov v7 inputs and uploader
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          directory: ./coverage/
          token: ${{ secrets.CODECOV_TOKEN }}
          override_branch: modernization-p0
          override_pr: 1
          override_commit: ${{ github.sha }}
          dry_run: true
          verbose: true
