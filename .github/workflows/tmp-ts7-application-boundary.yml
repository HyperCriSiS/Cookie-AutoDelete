name: Temporary TypeScript 7 application boundary probe

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/tmp-ts7-application-boundary.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install baseline dependencies
        run: npm ci --prefer-offline --no-fund
      - name: Install TypeScript 7 probe compiler
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall --save-dev ts-jest typescript
          npm install --save-dev typescript@7.0.2
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tsconfig.json')
          text = p.read_text()
          old_module = '    "module": "commonjs" /* Specify module code generation: \'none\', \'commonjs\', \'amd\', \'system\', \'umd\', \'es2015\', or \'ESNext\'. */,\n'
          old_resolution = '    "moduleResolution": "node" /* Specify module resolution strategy: \'node\' (Node.js) or \'classic\' (TypeScript pre-1.6). */,\n'
          if text.count(old_module) != 1 or text.count(old_resolution) != 1:
              raise SystemExit('Expected legacy module/moduleResolution settings exactly once')
          text = text.replace(old_module, '    "module": "Node16",\n', 1)
          text = text.replace(old_resolution, '    "moduleResolution": "Node16",\n', 1)
          p.write_text(text)
          PY
          npx tsc --version
      - name: Capture TS7 diagnostics
        id: tsc
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/ts7.log 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/ts7.log
      - name: Classify direct third-party declaration diagnostics
        shell: bash
        run: |
          if grep -Eq '^node_modules/(react-redux|@types/node)/.*error TS' /tmp/ts7.log; then
            echo 'Direct third-party declaration diagnostics are still present.' >&2
            exit 1
          fi
          echo 'No direct React-Redux or @types/node declaration diagnostics.'
      - name: Classify CAD application diagnostics
        shell: bash
        continue-on-error: true
        run: |
          if grep -Eq '^(src|__tests__)/.*error TS' /tmp/ts7.log; then
            echo 'CAD application/test diagnostics are present.' >&2
            exit 1
          fi
          echo 'No CAD application/test diagnostics.'
      - name: Classify remaining TS7 diagnostics
        shell: bash
        continue-on-error: true
        run: |
          if grep -Eq 'error TS' /tmp/ts7.log; then
            echo 'Some TypeScript 7 diagnostics remain.' >&2
            exit 1
          fi
          echo 'TypeScript 7 whole-program compile is clean.'
      - name: Report TypeScript 7 compile status
        shell: bash
        run: |
          if [ "${{ steps.tsc.outputs.exit_code }}" = "0" ]; then
            echo 'TypeScript 7 whole-program compile succeeded.'
          else
            echo 'TypeScript 7 whole-program compile still has diagnostics; classification steps above identify their scope.'
          fi