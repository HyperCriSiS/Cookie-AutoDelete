name: Temporary dependency audit

on:
  push:
    branches:
      - modernization-p0

permissions:
  contents: read

jobs:
  audit:
    if: "${{ github.event.head_commit.message == 'chore: inspect remaining dependency vulnerabilities' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Inspect npm audit graph
        run: |
          npx --yes npm@8.19.4 audit --package-lock-only --json > dependency-audit.json || true
          node <<'NODE'
          const a = require('./dependency-audit.json');
          console.log('VULNERABILITY_TOTALS', JSON.stringify(a.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(a.vulnerabilities || {}).sort(([a],[b]) => a.localeCompare(b))) {
            console.log('VULN', JSON.stringify({
              name,
              severity: v.severity,
              direct: v.isDirect,
              via: (v.via || []).map(x => typeof x === 'string' ? x : {name:x.name, severity:x.severity, range:x.range, url:x.url}),
              effects: v.effects,
              range: v.range,
              nodes: v.nodes,
              fixAvailable: v.fixAvailable,
            }));
          }
          NODE
