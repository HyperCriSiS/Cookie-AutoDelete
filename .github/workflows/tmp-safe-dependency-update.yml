name: Temporary Jest 30 isolated validation

on:
  push:
    branches:
      - modernization-p0

permissions:
  contents: write

jobs:
  validate:
    if: "${{ github.event.head_commit.message == 'chore: validate isolated Jest 30 tests' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: modernization-p0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Stage Jest 30 dependency family
        run: |
          npx --yes npm@8.19.4 install --save-dev 'jest@^30.4.2' 'jest-when@^4.0.3' --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Adapt Jest 30 compatibility points
        run: |
          cat > tools/jest-typescript-transformer.cjs <<'EOF'
          const ts = require('typescript');

          module.exports = {
            process(sourceText, sourcePath) {
              const result = ts.transpileModule(sourceText, {
                fileName: sourcePath,
                compilerOptions: {
                  allowSyntheticDefaultImports: true,
                  esModuleInterop: true,
                  jsx: ts.JsxEmit.React,
                  module: ts.ModuleKind.CommonJS,
                  sourceMap: true,
                  target: ts.ScriptTarget.ES2017,
                },
              });

              return { code: result.outputText };
            },
          };
          EOF
          python <<'PY'
          from pathlib import Path

          libs = Path('__tests__/services/Libs.spec.ts')
          text = libs.read_text()
          replacements = {
              'global.browser.i18n.getMessage.clearMocks();': 'global.browser.i18n.getMessage.mockReset();',
              'global.browser.runtime.getManifest.clearMocks();': 'global.browser.runtime.getManifest.mockReset();',
              'global.browser.runtime.getURL.clearMocks();': 'global.browser.runtime.getURL.mockReset();',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 2:
                  raise SystemExit(f'Expected exactly 2 occurrences of {old!r}, found {count}')
              text = text.replace(old, new)
          libs.write_text(text)

          tabs = Path('__tests__/services/TabEvents.spec.ts')
          text = tabs.read_text()
          old = "when(spyTabEvents.getAllCookieActions)\n        .calledWith()\n        .mockResolvedValue(undefined as any);"
          new = "when(spyTabEvents.getAllCookieActions)\n        .calledWith(expect.any(Object))\n        .mockResolvedValue(undefined as any);"
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one onTabUpdate getAllCookieActions stub')
          tabs.write_text(text.replace(old, new))
          PY
      - name: Install candidate dependency graph
        run: npx --yes npm@8.19.4 ci --ignore-scripts --no-audit --no-fund
      - name: Run full test suite
        run: npm test -- --runInBand
      - name: Run TS7 typecheck
        run: npm run typecheck
      - name: Run lint
        run: npm run lint
      - name: Build and validate Firefox and Chromium packages
        run: npm run build
      - name: Audit candidate graph
        run: |
          npx --yes npm@8.19.4 audit --package-lock-only --json > dependency-audit.json || true
          npx --yes npm@8.19.4 audit --package-lock-only --omit=dev --json > runtime-audit.json || true
          node -e "const a=require('./dependency-audit.json'); console.log('FULL_AUDIT', JSON.stringify(a.metadata?.vulnerabilities || {}));"
          node -e "const a=require('./runtime-audit.json'); console.log('RUNTIME_AUDIT', JSON.stringify(a.metadata?.vulnerabilities || {}));"
          node -e "const a=require('./dependency-audit.json'); for (const [n,v] of Object.entries(a.vulnerabilities||{}).sort(([a],[b])=>a.localeCompare(b))) console.log('REMAINING',n,v.severity,JSON.stringify(v.fixAvailable));"
      - name: Commit validated Jest 30 migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json tools/jest-typescript-transformer.cjs __tests__/services/Libs.spec.ts __tests__/services/TabEvents.spec.ts
          git commit -m 'test: migrate Jest toolchain to 30'
          git push origin HEAD:modernization-p0
