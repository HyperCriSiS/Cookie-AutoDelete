name: Temporary release docs update

on:
  push:
    branches:
      - modernization-p0
    paths:
      - .github/workflows/tmp-update-release-docs.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: modernization-p0
      - name: Update roadmap and RC checklist
        run: |
          python <<'PY'
          from pathlib import Path

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          old = "The pinned release-candidate source commit is `fc70abfe`, whose regular functional CI is green (`Initial Checks`, `Tests, Builds, Coverage`, CodeQL and JavaScript/TypeScript/Actions analysis). The branch may advance through documentation-only commits without invalidating RC artifact `9392296156`; documentation-only commits remain subject to regular CI, and `2cdd346c` was verified green in all three regular CI event paths. Any change to the base or candidate-affecting runtime/source, manifest, build/packaging, dependency or toolchain state requires a replacement RC and repetition of the affected gates. The regular CI includes an explicit TypeScript 7 `npm run typecheck` gate in addition to tests, lint and build. PR #1 is currently mergeable/clean against `3.X.X-Branch` base `81b259c1`. The separate `github-advanced-security` agent still fails before repository analysis because the GitHub-hosted agent requests an unsupported model; this remains classified as an external GitHub service/configuration problem rather than a functional repository defect."
          new = "The pinned release-candidate source commit is `53209f36`, whose regular functional CI is green in all three event paths: push `32439375945`, `pull_request_target` `32439377479`, and pull request `32439378775`. Pull-request CI produced replacement RC artifact `9431860563` (GitHub wrapper digest `sha256:891232f8281af65ede7cb80e1da7fe1911d11b55eea67a614408dcf01f29cc41`) containing the same-source Chromium ZIP, Firefox XPI and `SHA256SUMS.txt`. That exact source passed TypeScript 7 typecheck, 37/37 Jest suites (577/577 tests), lint, Firefox archive validation (60 files), Chromium archive validation (61 files), and Firefox ZIP/XPI byte identity. The branch may advance through documentation-only commits without invalidating this pinned candidate; any change to the base or candidate-affecting runtime/source, manifest, build/packaging, dependency or toolchain state requires a replacement RC and repetition of the affected gates. PR #1 is currently mergeable/clean against `3.X.X-Branch` base `81b259c1`. The separate `github-advanced-security` agent still fails before repository analysis because the GitHub-hosted agent requests an unsupported model; this remains classified as an external GitHub service/configuration problem rather than a functional repository defect."
          replace_once(old, new, 'current RC paragraph')

          anchor = "  - [x] Resolve the remaining security dependency PRs from the current modernization lockfile instead of merging their stale dependency graph. `copy-webpack-plugin` is now `14.0.0`, with the targeted transitive fixes including `serialize-javascript 7.1.0`, `lodash 4.18.1`, `tough-cookie 4.1.4`, `form-data 3.0.5`, `ws 7.5.13`, `minimatch 3.1.5` and `js-yaml 3.15.1`. Final state `756e64ba` is green in regular CI: push `32320110348`, `pull_request_target` `32320111670`, and pull request `32320112760`; superseded PRs #13, #14 and #15 are closed with rationale recorded."
          extra = """
            - [x] Integrate the later compatible dependency updates from the current modernization graph instead of merging stale-base Dependabot branches: `webextension-polyfill` is now `0.12.0` and `ts-loader` is `9.6.2`. SemVer-safe lockfile remediation was also applied before the final test-toolchain migration.
            - [x] Complete the coordinated Jest 30 migration rather than accepting the stale grouped dependency proposal. Current test tooling uses `jest@30.4.2`, `jest-environment-jsdom@30.4.1`, `jest-when@4.0.3` and the repository-local TypeScript transformer. Compatibility work replaced obsolete `jest-when` `.clearMocks()` calls with `.mockReset()` and fixed an argument-mismatched `TabEvents` mock that leaked into real asynchronous cookie-domain code. Validation run `32437006947` passed the full suite, TS7 typecheck, lint and both production builds; the candidate dependency graph reported **zero** findings in both full `npm audit` and `npm audit --omit=dev`. Production migration commit: `5fcd4a4d`.
            - [x] Resolve Dependabot PRs #25–#31 without unsafe wholesale merges. PRs #28 (`webextension-polyfill`), #29 (`ts-loader`) and #30 (`softprops/action-gh-release`) were superseded by independently validated modernization changes; grouped PR #31 was superseded by the targeted security/Jest/toolchain work. Bootstrap 5 (#25), React DOM 19 (#26) and `@typescript-eslint` 8 (#27) were deliberately deferred as coordinated post-RC major migrations because partial adoption would make the current Bootstrap 4 / React 17 / ESLint 7 stacks inconsistent. All seven PRs are closed with rationale recorded; only draft PR #1 remains open.""".replace('\n          ', '\n').rstrip()
          replace_once(anchor, anchor + '\n' + extra, 'dependency review anchor')

          old = "- [x] Regenerate the final same-source `release-candidate-packages` artifact after base synchronization. Exact post-sync head `fc70abfe` is green in regular CI: push `32328751515`, `pull_request_target` `32328753605`, and pull request `32328755047`. Pull-request run `32328755047` rebuilt and validated the actual Firefox archive (60 files), Chromium archive (61 files), and Firefox ZIP/XPI byte identity; 37/37 Jest suites and 577/577 tests passed. Artifact `9392296156` contains exactly `*Firefox.xpi`, `*Chrome.zip`, and `SHA256SUMS.txt`; its GitHub artifact digest is `sha256:935bd491a8c53ddc75ab4b88e276b04605bb04d8f8af5061856882ac84f18985`."
          new = """- [x] Regenerate the first post-base-sync same-source `release-candidate-packages` artifact. Exact post-sync head `fc70abfe` was green in regular CI and produced artifact `9392296156`; that candidate is now **superseded** because later dependency/test-toolchain and tagged-workflow changes affected the candidate state.
          - [x] Revalidate the dependency/test toolchain after the post-sync update pass. Jest 30, `webextension-polyfill 0.12.0`, `ts-loader 9.6.2`, the repaired lockfile and Node engine metadata are now integrated; full and runtime `npm audit` both reached zero findings during the validated Jest migration.
          - [x] Align tagged test-build and tagged release workflows with the permanent release gates. Commit `0363f282` moved the test-build path from hard-coded Node 18 to `.nvmrc`, added locked-install/npm caching and permanent TS7 typecheck to both tag pipelines, pinned `softprops/action-gh-release` to v3.0.2, and added `SHA256SUMS.txt` to tagged package uploads. Regular CI on that workflow state is green: push `32439203126`, `pull_request_target` `32439204333`, and pull request `32439205746`.
          - [x] Remove all temporary dependency/Jest/lock synchronization helpers and generate the current replacement release candidate from the clean technical head. Exact candidate source `53209f36` is green in regular CI: push `32439375945`, `pull_request_target` `32439377479`, and pull request `32439378775`. Pull-request run `32439378775` passed TS7 typecheck, 37/37 Jest suites (577/577 tests), lint, Firefox archive validation (60 files), Chromium archive validation (61 files), and Firefox ZIP/XPI byte identity. Artifact `9431860563` contains exactly `*Firefox.xpi`, `*Chrome.zip`, and `SHA256SUMS.txt`; its GitHub wrapper digest is `sha256:891232f8281af65ede7cb80e1da7fe1911d11b55eea67a614408dcf01f29cc41`.""".replace('\n          ', '\n')
          replace_once(old, new, 'phase 4 RC history')

          old = "- There is currently no base-drift blocker: PR #1 is clean/mergeable against `3.X.X-Branch` base `81b259c1`, and pinned RC source `fc70abfe` was generated afterward. Documentation-only commits after that source do not invalidate artifact `9392296156`; any base change or candidate-affecting runtime/source, manifest, build/packaging, dependency or toolchain change requires a replacement candidate and repetition of the affected gates."
          new = "- There is currently no base-drift blocker: PR #1 is clean/mergeable against `3.X.X-Branch` base `81b259c1`, and pinned replacement RC source `53209f36` was generated after the latest candidate-affecting dependency/toolchain/workflow changes. Documentation-only commits after that source do not invalidate artifact `9431860563`; any base change or candidate-affecting runtime/source, manifest, build/packaging, dependency or toolchain change requires a replacement candidate and repetition of the affected gates."
          replace_once(old, new, 'blocker RC reference')

          old = "**Not fully completed.** Manifest V3 foundations, functional CI stabilization, the automated migration/runtime compatibility pass, Archiver 8 / Redux 5 modernization, maintained Firefox WebExtension typings and the coordinated TypeScript 7 migration are complete and verified. TypeScript 7 is protected by the regular CI typecheck, `ts-jest` and temporary TS7 probes are removed, and the repaired dependency lock supports reproducible `npm ci`. Phase 3 is complete: dependency/toolchain modernization and generated-package content auditing are permanently enforced and green. Phase 4 now also has automated coverage for published historical 3.0.2/3.4.0/3.6.0 release-state schemas, a fail-safe PR-target CI precheck, a clean base-synchronized PR #1, and final automated same-source RC artifact `9392296156` from head `fc70abfe`. The remaining release blockers are manual packaged-browser validation and real representative historical-profile/export upgrade validation; merge/tagging remain prohibited until those gates pass."
          new = "**Not fully completed.** Manifest V3 foundations, functional CI stabilization, the automated migration/runtime compatibility pass, Archiver 8 / Redux 5 modernization, maintained Firefox WebExtension typings, TypeScript 7 and the coordinated Jest 30 migration are complete and verified. TypeScript 7 is protected by regular CI typecheck; the repaired dependency graph supports reproducible `npm ci` and reached zero findings in the validated full/runtime npm audits. Phase 3 is complete: dependency/toolchain modernization and generated-package content auditing are permanently enforced and green. Phase 4 now also has automated coverage for published historical 3.0.2/3.4.0/3.6.0 release-state schemas, hardened tag/release pipelines, a clean base-synchronized PR #1, and current automated same-source RC artifact `9431860563` from source `53209f36`. The remaining release blockers are manual packaged-browser validation and real representative historical-profile/export upgrade validation; merge/tagging remain prohibited until those gates pass."
          replace_once(old, new, 'completion status')
          roadmap.write_text(text)

          checklist = Path('RC_TEST_CHECKLIST.md')
          c = checklist.read_text()
          replacements = {
              '`fc70abfefa5a0792eac1fd6663a2909cb80fc7c0`': '`53209f360b52b7e6a3f4025cc07c910b24c0151f`',
              '`32328755047`': '`32439378775`',
              '`9392296156`': '`9431860563`',
              '`Cookie-AutoDelete_Dev_20260820_033541_fc70abf_Firefox.xpi`': '`Cookie-AutoDelete_Dev_20260821_021858_53209f3_Firefox.xpi`',
              '`Cookie-AutoDelete_Dev_20260820_033541_fc70abf_Chrome.zip`': '`Cookie-AutoDelete_Dev_20260821_021858_53209f3_Chrome.zip`',
              '`sha256:935bd491a8c53ddc75ab4b88e276b04605bb04d8f8af5061856882ac84f18985`': '`sha256:891232f8281af65ede7cb80e1da7fe1911d11b55eea67a614408dcf01f29cc41`',
          }
          for old, new in replacements.items():
              if old not in c:
                  raise SystemExit(f'checklist missing {old}')
              c = c.replace(old, new)
          old = "Automated validation for this exact candidate already passed archive/stage parity (60 Firefox files, 61 Chromium files), Firefox ZIP/XPI byte identity, TypeScript 7 typecheck, 37/37 Jest suites (577/577 tests), lint and production build."
          new = old + " The dependency/test-toolchain state includes Jest 30, `webextension-polyfill 0.12.0` and `ts-loader 9.6.2`; the validated dependency migration reached zero findings in both full `npm audit` and `npm audit --omit=dev`."
          if c.count(old) != 1:
              raise SystemExit('unexpected automated-validation sentence count')
          c = c.replace(old, new, 1)
          checklist.write_text(c)
          PY
      - name: Commit documentation update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md RC_TEST_CHECKLIST.md
          git diff --cached --check
          git commit -m 'docs: refresh release candidate state'
          git push origin HEAD:modernization-p0
