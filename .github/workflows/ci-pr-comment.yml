name: CI PR Build Download Comment

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed
    branches-ignore:
      - '_archived__**'

concurrency:
  group: pr-results-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  publish_pr_results:
    name: Publish PR coverage and build links
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_branch, 'l10n_') &&
      github.event.workflow_run.pull_requests[0].number != null
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Codecov.io Coverage Upload
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          directory: ./coverage/
          token: ${{ secrets.CODECOV_TOKEN }}
          override_branch: ${{ github.event.workflow_run.head_branch }}
          override_pr: ${{ github.event.workflow_run.pull_requests[0].number }}
          override_commit: ${{ github.event.workflow_run.head_sha }}
      - name: Coveralls.io Coverage Upload
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          git-branch: ${{ github.event.workflow_run.head_branch }}
          git-commit: ${{ github.event.workflow_run.head_sha }}
      - name: Generate PR build download comment
        id: workflowArtifacts
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const buildArtifacts = allArtifacts.data.artifacts.filter((a) =>
              a.name.includes('Cookie-AutoDelete') && !a.expired
            ).map((a) => ({
              id: a.id,
              name: a.name,
              created_at: a.created_at,
              expires_at: a.expires_at,
              artifact_url: `${context.payload.workflow_run.head_repository.html_url}/suites/${context.payload.workflow_run.check_suite_id}/artifacts/${a.id}`,
            }));
            if (buildArtifacts.length === 0) {
              console.log('No downloadable browser build artifacts found.');
              return '';
            }
            let pr_body = `## Pull Request Build: ${context.payload.workflow_run.id}\n\n- based on latest commit: ${context.payload.workflow_run.head_sha}\n\n`;
            pr_body += 'Unsigned webextension builds for testing are ready for download!\nThese test builds are kept for up to 90 days.\nUse a fresh profile when testing to avoid modifying existing data.\n\n';
            pr_body += '### Download links\n\n**You must be signed into GitHub before using these links.**\n\n';
            pr_body += '| Filename | Created | Expires |\n| --- | --- | --- |\n';
            for (const a of buildArtifacts) {
              pr_body += `| [${a.name}](${a.artifact_url}) | ${a.created_at.replace('T', ' @ ')} UTC | ${a.expires_at.replace('T', ' @ ')} UTC |\n`;
            }
            pr_body += '\nIf a link no longer works, use `/get-build` for the latest build or `get-build <run-id>` for a specific CI run.';
            return pr_body;
      - name: Hide outdated PR build comment
        if: steps.workflowArtifacts.outputs.result != ''
        uses: kanga333/comment-hider@v0.4.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          issue_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      - name: Create PR build comment
        if: steps.workflowArtifacts.outputs.result != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          body: ${{ steps.workflowArtifacts.outputs.result }}
          reactions: heart
